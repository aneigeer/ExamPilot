plugins {
    id 'com.android.application'
}

// ------------------------------------------------------------------
// 发布签名：从 student-app/keystore.properties 读取（该文件与密钥库均不入库）
// 未提供时 release 回退到 debug 签名，保证本地构建/演示不被阻断。
// keystore.properties 模板：
//   storeFile=release.jks
//   storePassword=***
//   keyAlias=examprep
//   keyPassword=***
// ------------------------------------------------------------------
def keystorePropsFile = rootProject.file("keystore.properties")
def hasReleaseSigning = keystorePropsFile.exists()

def customBaseUrl = project.findProperty('APP_BASE_URL')?.toString()?.trim()
def normalizeUrl = { String raw -> raw.endsWith('/') ? raw : "${raw}/" }
def debugBaseUrl = normalizeUrl(customBaseUrl ?: 'http://10.0.2.2:8080/api/')
def releaseBaseUrl = normalizeUrl(customBaseUrl ?: 'https://10.200.34.206/api/')

android {
    namespace 'com.examprep.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.examprep.app"
        minSdk 26
        targetSdk 34
        versionCode 10
        versionName "1.9.1"
        // 模拟器访问宿主机用 10.0.2.2（debug 默认），也可通过 -PAPP_BASE_URL=... 覆盖
        buildConfigField "String", "BASE_URL", "\"${debugBaseUrl}\""
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                def props = new Properties()
                keystorePropsFile.withInputStream { props.load(it) }
                storeFile rootProject.file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // 上架要求：开启混淆 + 资源压缩（规则见 proguard-rules.pro）
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 真机版：默认指向当前局域网 nginx 443，支持 -PAPP_BASE_URL=https://... 或登录页运行时修改
            // 换局域网 IP 后：重跑 scripts/生成自签证书.ps1 → 重打 APK（或传 -PAPP_BASE_URL=...）
            buildConfigField "String", "BASE_URL", "\"${releaseBaseUrl}\""
            // 未提供正式密钥时回退 debug 签名，保证本地可安装/演示；正式上架必须换成 release.jks
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.6'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
}
