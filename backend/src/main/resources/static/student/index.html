<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ExamPilot · 学生端</title>
<link rel="stylesheet" href="../admin/vendor/element-plus.css">
<style>
  :root{
    --bg:#f4f7fb;
    --card:#ffffff;
    --primary:#2f6fed;
    --primary-dark:#2258c4;
    --text:#1e2733;
    --muted:#6b7686;
    --line:#e6ebf3;
    --ok:#12a06a;
    --ok-bg:#eaf8f1;
    --bad:#dd4a4a;
    --bad-bg:#fdeeee;
    --warn:#c27b09;
    --warn-bg:#fdf4e3;
    --radius:14px;
    --shadow:0 2px 12px rgba(23,43,77,.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:15px;
    line-height:1.6;
    min-width:360px;
    overflow-x:hidden;
  }
  [v-cloak]{display:none}
  button{font-family:inherit}
  input,textarea,select{font-family:inherit;font-size:15px;color:var(--text)}
  .muted{color:var(--muted)}
  .small{font-size:13px}

  /* ---------- 通用控件 ---------- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    border:1px solid var(--line);background:#fff;color:var(--text);
    padding:9px 18px;border-radius:10px;font-size:14px;cursor:pointer;
    transition:.16s;white-space:nowrap;
  }
  .btn:hover{border-color:#cfd9e8;background:#fafcff}
  .btn:active{transform:translateY(1px)}
  .btn[disabled]{opacity:.55;cursor:not-allowed;transform:none}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
  .btn.primary:hover{background:var(--primary-dark);border-color:var(--primary-dark)}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:7px 12px}
  .btn.ghost:hover{background:#f1f5fb;color:var(--text)}
  .btn.sm{padding:5px 12px;font-size:13px;border-radius:8px}
  .btn.block{width:100%}

  .card{
    background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:20px;margin-bottom:16px;border:1px solid rgba(230,235,243,.7);
  }
  .card-title{font-size:17px;font-weight:700;letter-spacing:.2px}
  .sub{color:var(--muted);font-size:13px;margin:4px 0 16px}
  .tag{
    display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;
    background:#eaf1ff;color:var(--primary);line-height:1.6;
  }
  .tag.ghost{background:#f2f5fa;color:var(--muted)}
  .tag.xs{font-size:11px;padding:1px 7px}
  .tag.ok{background:var(--ok-bg);color:var(--ok)}
  .tag.bad{background:var(--bad-bg);color:var(--bad)}
  .tag.warn{background:var(--warn-bg);color:var(--warn)}

  /* ---------- 登录 ---------- */
  .login-wrap{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;
    background:
      radial-gradient(900px 400px at 12% -8%, #e3ecff 0%, rgba(227,236,255,0) 60%),
      radial-gradient(700px 380px at 92% 8%, #e6f7f1 0%, rgba(230,247,241,0) 62%),
      var(--bg);
  }
  .login-card{
    width:100%;max-width:380px;background:#fff;border-radius:18px;
    box-shadow:0 10px 40px rgba(28,52,94,.10);padding:30px 26px 24px;
  }
  .brand-badge{
    width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#4a86ff,#2f6fed);color:#fff;font-weight:700;font-size:20px;
    box-shadow:0 6px 16px rgba(47,111,237,.28);margin-bottom:16px;
  }
  .login-card h1{font-size:21px;margin:0 0 6px;letter-spacing:.3px}
  .login-card p.lead{color:var(--muted);font-size:13px;margin:0 0 22px}
  .field{display:block;margin-bottom:14px}
  .field>span{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  .field input,.field select,.field textarea{
    width:100%;border:1px solid var(--line);background:#fbfcfe;border-radius:10px;
    padding:11px 12px;outline:none;transition:.16s;
  }
  .field input:focus,.field select:focus,.field textarea:focus{
    border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(47,111,237,.12);
  }
  .field input::placeholder,.field textarea::placeholder{color:#a9b3c2}
  .login-hint{text-align:center;color:#9aa5b5;font-size:12px;margin:14px 0 0}

  /* ---------- 头部 ---------- */
  .topbar{
    background:rgba(255,255,255,.94);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;
  }
  .topbar-inner{
    max-width:960px;margin:0 auto;padding:12px 16px 6px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;letter-spacing:.3px}
  .brand .dot{
    width:10px;height:10px;border-radius:50%;
    background:linear-gradient(135deg,#4a86ff,#2f6fed);box-shadow:0 0 0 3px rgba(47,111,237,.14);
  }
  .userbox{display:flex;align-items:center;gap:8px;min-width:0}
  .nick{font-weight:600;font-size:14px;max-width:8em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sid{color:var(--muted);font-size:12px}
  .tabs{
    max-width:960px;margin:0 auto;padding:0 10px 8px;display:flex;gap:4px;overflow-x:auto;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    flex:1 0 auto;min-width:74px;border:0;background:transparent;color:var(--muted);
    font-size:14px;padding:8px 10px;border-radius:9px;cursor:pointer;transition:.16s;white-space:nowrap;
  }
  .tab:hover{background:#f2f6fd;color:var(--text)}
  .tab.active{background:#eaf1ff;color:var(--primary);font-weight:700}

  .main{max-width:960px;margin:0 auto;padding:18px 16px 48px}
  .page-head{margin:2px 0 14px}
  .page-head h2{font-size:19px;margin:0 0 4px}
  .page-head p{margin:0;color:var(--muted);font-size:13px}

  /* ---------- 表单 ---------- */
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .form-grid .full{grid-column:1 / -1}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{
    border:1px solid var(--line);background:#fbfcfe;border-radius:10px;padding:9px 16px;
    font-size:14px;color:var(--muted);cursor:pointer;transition:.16s;
  }
  .chip:hover{border-color:#cfd9e8;color:var(--text)}
  .chip.on{background:#eaf1ff;border-color:#bcd2ff;color:var(--primary);font-weight:700}
  .chip.done{background:var(--ok-bg);border-color:#bfe6cf;color:var(--ok)}
  .actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px}

  /* ---------- 答题 ---------- */
  .q-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .q-meta{display:flex;gap:6px;flex-wrap:wrap}
  .q-progress{color:var(--muted);font-size:13px}
  .progressbar{height:6px;border-radius:99px;background:#eef2f8;margin:12px 0 18px;overflow:hidden}
  .progressbar i{display:block;height:100%;background:linear-gradient(90deg,#5b93ff,#2f6fed);border-radius:99px;transition:width .3s}
  .material{
    background:#f7f9fd;border-left:3px solid #c7d8f7;border-radius:0 10px 10px 0;
    padding:12px 14px;color:#41506a;font-size:14px;white-space:pre-wrap;margin-bottom:14px;
    overflow-wrap:anywhere;
  }
  .stem{font-size:16px;font-weight:600;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere;margin-bottom:16px}
  .options{display:flex;flex-direction:column;gap:10px}
  .opt{
    display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);border-radius:11px;
    padding:11px 13px;cursor:pointer;background:#fcfdff;transition:.16s;
  }
  .opt:hover{border-color:#c9d8f0;background:#f8fbff}
  .opt.sel{border-color:var(--primary);background:#f2f7ff;box-shadow:0 0 0 2px rgba(47,111,237,.08)}
  .opt.locked{cursor:default;opacity:.92}
  .opt input{margin:5px 0 0;accent-color:var(--primary);flex:0 0 auto}
  .opt-key{
    flex:0 0 auto;width:22px;height:22px;border-radius:6px;background:#eef3fb;color:#5a6b86;
    font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px;
  }
  .opt.sel .opt-key{background:var(--primary);color:#fff}
  .opt-content{flex:1;min-width:0;overflow-wrap:anywhere}
  .answer-area{margin-top:2px}
  .answer-area textarea{width:100%;min-height:96px;resize:vertical;border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:#fbfcfe;outline:none}
  .answer-area textarea:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(47,111,237,.12)}
  .subtip{color:var(--muted);font-size:12px;margin-top:6px}

  .feedback{margin-top:16px;border-radius:12px;padding:14px;border:1px solid transparent}
  .feedback.ok{background:var(--ok-bg);border-color:#cdeade}
  .feedback.bad{background:var(--bad-bg);border-color:#f6d6d6}
  .feedback.warn{background:var(--warn-bg);border-color:#f2e0c2}
  .fb-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
  .fb-badge{font-weight:700;font-size:14px}
  .fb-badge.ok{color:var(--ok)}
  .fb-badge.bad{color:var(--bad)}
  .fb-badge.warn{color:var(--warn)}
  .fb-ans{font-weight:600;overflow-wrap:anywhere}
  .feedback .analysis{margin-top:10px;background:rgba(255,255,255,.7);border-radius:9px;padding:10px 12px}
  .feedback .analysis strong{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:2px}
  .feedback .analysis p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
  .ref-box{margin-top:8px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
  .ref-box b{font-size:12px;color:var(--muted);display:block;font-weight:600}
  .selfeval{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .selfeval .btn{background:#fff}

  /* ---------- 报告 ---------- */
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
  .stat{
    background:#f8fafd;border:1px solid var(--line);border-radius:12px;padding:14px 12px;text-align:center;
  }
  .stat .n{font-size:23px;font-weight:800;letter-spacing:.5px;color:var(--primary);line-height:1.25;word-break:break-all}
  .stat .l{font-size:12px;color:var(--muted);margin-top:2px}
  .stat.ok .n{color:var(--ok)}
  .stat.bad .n{color:var(--bad)}

  /* ---------- 错题 / 列表 ---------- */
  .w-item{margin-bottom:12px}
  .w-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
  .w-stem{font-weight:600;overflow-wrap:anywhere;white-space:pre-wrap}
  .kv{display:flex;gap:8px;font-size:14px;margin-top:8px;flex-wrap:wrap}
  .kv>span{color:var(--muted);flex:0 0 auto}
  .kv>b{font-weight:600;overflow-wrap:anywhere}
  .ok-text{color:var(--ok)}
  .bad-text{color:var(--bad)}
  .w-analysis{margin-top:10px;background:#f8fafd;border-radius:9px;padding:10px 12px;font-size:14px}
  .w-analysis strong{display:block;font-size:12px;color:var(--muted);font-weight:600}
  .w-analysis p{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}

  /* ---------- 统计 ---------- */
  .bars{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:8px}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
  .bar-num{font-size:11px;color:var(--muted);margin-bottom:3px}
  .bar-wrap{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
  .bar{
    width:64%;max-width:30px;border-radius:6px 6px 3px 3px;min-height:3px;
    background:linear-gradient(180deg,#6ea2ff,#2f6fed);transition:height .35s;
  }
  .bar.empty{background:#e7edf7}
  .bar-date{font-size:11px;color:var(--muted);margin-top:6px;white-space:nowrap}
  .m-row{margin-top:14px}
  .m-head{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:6px}
  .m-head>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .m-bar{height:8px;background:#eef2f8;border-radius:99px;overflow:hidden}
  .m-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#5cc99b,#12a06a)}
  .m-bar i.low{background:linear-gradient(90deg,#f3b262,#e08a1e)}
  .m-bar i.vlow{background:linear-gradient(90deg,#f08a8a,#dd4a4a)}

  /* ---------- AI ---------- */
  .ai-input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fbfcfe;outline:none;min-height:92px;resize:vertical}
  .ai-input:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(47,111,237,.12)}
  .counter{text-align:right;color:#a9b3c2;font-size:12px;margin:4px 0 12px}
  .loading{
    margin-top:14px;background:#eff4ff;border:1px solid #d9e4ff;color:#34558f;border-radius:10px;
    padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:center;
  }
  .spinner{
    width:16px;height:16px;border-radius:50%;border:2px solid #b9ccf5;border-top-color:#2f6fed;
    animation:spin .8s linear infinite;flex:0 0 auto;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .ai-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .refused{
    background:var(--warn-bg);border:1px solid #f0dcb8;color:var(--warn);border-radius:10px;
    padding:11px 13px;font-weight:600;font-size:14px;margin-bottom:10px;
  }
  .answer{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8;font-size:15px}
  .sources{margin-top:18px;border-top:1px dashed var(--line);padding-top:14px}
  .src-title{font-size:13px;color:var(--muted);margin-bottom:8px}
  .src{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #f2f5fa}
  .src:last-child{border-bottom:0}
  .src-idx{flex:0 0 auto;width:20px;height:20px;border-radius:6px;background:#eef3fb;color:#5a6b86;font-size:11px;display:flex;align-items:center;justify-content:center;margin-top:2px}
  .src-body{min-width:0;flex:1}
  .src-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .src-name{font-weight:600;font-size:14px;overflow-wrap:anywhere}
  .src-snip{color:var(--muted);font-size:13px;margin-top:2px;overflow-wrap:anywhere;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  /* ---------- 空态 / 提示 ---------- */
  .empty{text-align:center;color:var(--muted);padding:34px 16px;font-size:14px}
  .empty .icon{font-size:26px;line-height:1;margin-bottom:8px;opacity:.5}
  .empty.sm{padding:16px;font-size:13px}
  .alert{border-radius:10px;padding:10px 13px;font-size:13px;margin-top:14px}
  .alert.bad{background:var(--bad-bg);color:#b23c3c;border:1px solid #f6d6d6}
  .foot{text-align:center;color:#a9b3c2;font-size:12px;padding:10px 0 0}

  @media (max-width:640px){
    body{font-size:14px}
    .main{padding:14px 12px 40px}
    .card{padding:16px;border-radius:12px}
    .login-card{padding:26px 20px 20px}
    .form-grid{grid-template-columns:1fr}
    .stat-grid{grid-template-columns:repeat(2,1fr);gap:10px}
    .stem{font-size:15px}
    .topbar-inner{padding:10px 12px 4px}
    .nick{max-width:6em}
    .sid{display:none}
    .tab{font-size:13px;min-width:66px;padding:7px 8px}
    .card-title{font-size:16px}
  }
</style>
</head>
<body>
<div id="app" v-cloak>

  <!-- ============ 登录 ============ -->
  <div class="login-wrap" v-if="!token">
    <div class="login-card">
      <div class="brand-badge" style="font-size:16px;letter-spacing:.5px">EP</div>
      <h1>ExamPilot</h1>
      <p class="lead">登录后可刷题、看错题、查统计、问 AI</p>
      <label class="field">
        <span>学号</span>
        <input v-model.trim="loginForm.studentNo" @keyup.enter="doLogin" placeholder="请输入学号" autocomplete="username" inputmode="numeric">
      </label>
      <label class="field">
        <span>密码</span>
        <input type="password" v-model="loginForm.password" @keyup.enter="doLogin" placeholder="请输入密码" autocomplete="current-password">
      </label>
      <div class="alert bad" v-if="loginError">{{ loginError }}</div>
      <button class="btn primary block" style="margin-top:6px" :disabled="loginLoading" @click="doLogin">
        {{ loginLoading ? '登录中…' : '登 录' }}
      </button>
      <p class="login-hint">演示账号 2021001 / 123456</p>
    </div>
  </div>

  <!-- ============ 主界面 ============ -->
  <template v-else>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand"><span class="dot"></span>ExamPilot</div>
        <div class="userbox">
          <span class="nick">{{ (user && user.nickname) || '同学' }}</span>
          <span class="sid">{{ user && user.maskedStudentNo }}</span>
          <button class="btn ghost sm" @click="logout">退出</button>
        </div>
      </div>
      <nav class="tabs">
        <button v-for="t in tabs" :key="t.key" class="tab" :class="{active: tab === t.key}" @click="switchTab(t.key)">{{ t.label }}</button>
      </nav>
    </header>

    <main class="main">

      <!-- ---------------- 题库练习 ---------------- -->
      <section v-if="tab === 'practice'">
        <div class="page-head">
          <h2>题库练习</h2>
          <p>随机抽题、当场判分，练完看报告</p>
        </div>

        <!-- 报告 -->
        <div class="card" v-if="report">
          <div class="card-title">本次练习报告</div>
          <div class="sub">
            {{ report.subjectName || currentSubjectName || '本次练习' }}
            <span v-if="report.status === 'FINISHED'"> · 已结束</span>
          </div>
          <div class="stat-grid">
            <div class="stat"><div class="n">{{ report.totalCount }}</div><div class="l">总题数</div></div>
            <div class="stat"><div class="n">{{ report.answeredCount }}</div><div class="l">已答</div></div>
            <div class="stat ok"><div class="n">{{ report.correctCount }}</div><div class="l">答对</div></div>
            <div class="stat"><div class="n">{{ fmtRate(report.accuracy) }}%</div><div class="l">正确率</div></div>
          </div>
          <div class="actions">
            <button class="btn primary" @click="resetPractice">再练一组</button>
            <button class="btn" @click="switchTab('wrong')">去错题本</button>
          </div>
        </div>

        <!-- 全部答完 -->
        <div class="card" v-else-if="allDone">
          <div class="card-title">这一组题目已全部作答</div>
          <div class="sub">可以结束练习，查看本次报告。</div>
          <div class="actions">
            <button class="btn primary" :disabled="finishing" @click="finishPractice">{{ finishing ? '生成报告中…' : '结束练习' }}</button>
            <button class="btn" @click="resetPractice">放弃本组</button>
          </div>
        </div>

        <!-- 答题 -->
        <div class="card" v-else-if="question">
          <div class="q-top">
            <div class="q-meta">
              <span class="tag">{{ question.typeName || question.type }}</span>
              <span class="tag ghost" v-if="question.difficulty">难度 {{ question.difficulty }}</span>
              <span class="tag ghost" v-if="question.score != null">{{ question.score }} 分</span>
            </div>
            <div class="q-progress">第 {{ questionIndex }} / {{ practice.totalCount }} 题</div>
          </div>
          <div class="progressbar"><i :style="{ width: progressPct + '%' }"></i></div>

          <div class="material" v-if="question.material">{{ question.material }}</div>
          <div class="stem">{{ question.stem }}</div>
          <div class="options" v-if="question.subQuestions && question.subQuestions.length">
            <div class="subtip" style="margin:0 0 4px">本题包含 {{ question.subQuestions.length }} 个小问，请在下方作答。</div>
          </div>

          <!-- 选项型 -->
          <div class="options" v-if="hasOptions">
            <label class="opt" v-for="o in question.options" :key="o.key"
                   :class="{ sel: isSelected(o.key), locked: !!feedback }">
              <input v-if="isMulti" type="checkbox" :value="o.key" v-model="multi" :disabled="!!feedback">
              <input v-else type="radio" :value="o.key" v-model="answer" :disabled="!!feedback">
              <span class="opt-key">{{ o.key }}</span>
              <span class="opt-content">{{ o.content }}</span>
            </label>
          </div>

          <!-- 判断题无选项时 -->
          <div class="options" v-else-if="question.type === 'TRUE_FALSE'">
            <label class="opt" v-for="v in ['正确','错误']" :key="v"
                   :class="{ sel: answer === v, locked: !!feedback }">
              <input type="radio" :value="v" v-model="answer" :disabled="!!feedback">
              <span class="opt-key">{{ v === '正确' ? 'T' : 'F' }}</span>
              <span class="opt-content">{{ v }}</span>
            </label>
          </div>

          <!-- 填空 -->
          <div class="answer-area" v-else-if="question.type === 'FILL_BLANK'">
            <input class="ai-input" style="min-height:0;padding:11px 12px"
                   v-model="answer" :disabled="!!feedback"
                   placeholder="请输入答案，多个空用竖线分隔，如：答案1|答案2">
            <div class="subtip">多个空请用竖线 | 分隔</div>
          </div>

          <!-- 主观题 -->
          <div class="answer-area" v-else>
            <textarea v-model="answer" :disabled="!!feedback" placeholder="请在此作答（主观题提交后需自评）"></textarea>
            <div class="subtip">主观题不自动判分，提交后请按实际情况自评</div>
          </div>

          <!-- 反馈 -->
          <div class="feedback" :class="fbClass" v-if="feedback">
            <template v-if="feedback.judged">
              <div class="fb-head">
                <span class="fb-badge" :class="feedback.correct ? 'ok' : 'bad'">{{ feedback.correct ? '回答正确' : '回答错误' }}</span>
                <span class="muted">正确答案：<b class="fb-ans">{{ feedback.correctAnswer || '—' }}</b></span>
              </div>
            </template>
            <template v-else>
              <div class="fb-head">
                <span class="fb-badge warn">主观题 · 请自评</span>
                <span class="muted" v-if="feedback.answeredCount != null">进度 {{ feedback.answeredCount }} / {{ feedback.totalCount }}</span>
              </div>
              <div class="ref-box" v-if="feedback.reference != null">
                <b>参考答案</b>{{ refText(feedback.reference) }}
              </div>
              <div class="ref-box" v-if="feedback.gradingPoints != null">
                <b>评分要点</b>{{ refText(feedback.gradingPoints) }}
              </div>
              <div class="selfeval" v-if="feedback.needSelfEval && !selfEvalDone">
                <button class="btn sm" @click="doSelfEval('KNOW')">会了</button>
                <button class="btn sm" @click="doSelfEval('UNSURE')">有点模糊</button>
                <button class="btn sm" @click="doSelfEval('DONT_KNOW')">不会</button>
              </div>
              <div class="ref-box" v-if="selfEvalDone" style="margin-top:10px;color:var(--warn)">
                已记录自评：{{ selfEvalLabel }}
              </div>
            </template>
            <div class="analysis" v-if="feedback.analysis">
              <strong>解析</strong>
              <p>{{ feedback.analysis }}</p>
            </div>
          </div>

          <div class="actions">
            <button class="btn primary" v-if="!feedback" :disabled="submitting" @click="submitAnswer">
              {{ submitting ? '判分中…' : '提交答案' }}
            </button>
            <button class="btn primary" v-else :disabled="nexting" @click="nextQuestion">
              {{ nexting ? '加载中…' : '下一题' }}
            </button>
            <button class="btn" :disabled="finishing" @click="finishPractice">结束练习</button>
          </div>
          <div class="alert bad" v-if="practiceError">{{ practiceError }}</div>
        </div>

        <!-- 开始练习 -->
        <div class="card" v-else>
          <div class="card-title">开始一组练习</div>
          <div class="sub">先选考试类别与科目，再按需选择练习模式、年份和题数；也可一键从全部题目随机抽题</div>

          <!-- 全库随机一键入口 + 题库总览统计 -->
          <div style="background:#eef4ff;border:1px solid #d6e3ff;border-radius:12px;padding:14px 16px;margin-bottom:18px">
            <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
              <button class="btn primary" :disabled="starting" @click="startRandomAll">
                {{ starting ? '正在抽题…' : '全库随机练习' }}
              </button>
              <span class="small muted">不限科目 / 类别 / 年份，mode=RANDOM，从全部题目随机抽题</span>
            </div>
            <div class="small" style="margin-top:10px" v-if="qStatsLoading">题库统计加载中…</div>
            <div class="alert bad" style="margin-top:10px" v-else-if="qStatsError">
              {{ qStatsError }} <button class="btn ghost sm" @click="loadQStats">重试</button>
            </div>
            <template v-else-if="qStats">
              <div class="small" style="margin-top:10px">题库共 <b>{{ qStats.total != null ? qStats.total : 0 }}</b> 道题</div>
              <div class="chips" style="margin-top:8px" v-if="qStatsByExamCode.length">
                <span class="chip" v-for="s in qStatsByExamCode" :key="s.key" style="cursor:default">{{ s.label }} {{ s.count }}</span>
              </div>
              <div class="chips" style="margin-top:6px" v-if="qStatsByYear.length">
                <span class="chip" v-for="s in qStatsByYear" :key="s.key" style="cursor:default">{{ s.key }} 年 {{ s.count }}</span>
              </div>
              <div class="empty sm" v-if="!qStatsByExamCode.length && !qStatsByYear.length">暂无分布数据</div>
            </template>
            <div class="empty sm" v-else>暂未获取到题库统计</div>
          </div>

          <div class="form-grid">
            <label class="field">
              <span>考试类别</span>
              <select v-model="examId" @change="onExamChange">
                <option :value="null">请选择考试类别</option>
                <option v-for="e in exams" :key="e.id" :value="e.id">{{ e.name }}</option>
              </select>
            </label>
            <label class="field">
              <span>科目</span>
              <select v-model="subjectId" :disabled="!examId || subjectsLoading">
                <option :value="null">{{ !examId ? '请先选考试类别' : (subjectsLoading ? '加载中…' : '请选择科目') }}</option>
                <option v-for="s in subjects" :key="s.id" :value="s.id">
                  {{ s.name }}{{ s.questionCount ? '（' + s.questionCount + ' 题）' : '' }}
                </option>
              </select>
            </label>
            <label class="field">
              <span>练习模式</span>
              <select v-model="practiceMode">
                <option v-for="m in practiceModes" :key="m.value" :value="m.value">{{ m.label }}</option>
              </select>
            </label>
            <label class="field" v-if="practiceMode === 'BY_TYPE'">
              <span>题型</span>
              <select v-model="practiceType">
                <option :value="null">请选择题型</option>
                <option v-for="t in practiceTypes" :key="t.value" :value="t.value">{{ t.label }}</option>
              </select>
            </label>
            <label class="field">
              <span>考试类别（题库）</span>
              <select v-model="practiceExamCode" :disabled="examCategoriesLoading">
                <option :value="null">{{ examCategoriesLoading ? '类别加载中…' : '全部类别' }}</option>
                <option v-for="c in examCategories" :key="c.examCode" :value="c.examCode">
                  {{ examName(c.examCode) }}{{ c.count != null ? '（' + c.count + ' 题）' : '' }}
                </option>
              </select>
              <span class="subtip" v-if="examCategoriesError" style="color:var(--bad)">
                {{ examCategoriesError }} <button class="btn ghost sm" @click="loadExamCategories">重试</button>
              </span>
              <span class="subtip" v-else-if="!examCategoriesLoading && !examCategories.length">暂无类别数据，可留空表示全部类别</span>
            </label>
            <label class="field">
              <span>真题年份</span>
              <select v-model="practiceYear" :disabled="yearsLoading">
                <option :value="null">{{ yearsLoading ? '年份加载中…' : '全部年份' }}</option>
                <option v-for="y in yearOptions" :key="y.year" :value="y.year">
                  {{ y.year }} 年{{ y.count != null ? '（' + y.count + ' 题）' : '' }}
                </option>
              </select>
              <span class="subtip" v-if="yearsError" style="color:var(--bad)">
                {{ yearsError }} <button class="btn ghost sm" @click="loadYears">重试</button>
              </span>
              <span class="subtip" v-else-if="!yearsLoading && !yearOptions.length">暂无年份数据，可留空表示全部年份</span>
            </label>
            <label class="field">
              <span>本次题数（1–200）</span>
              <input type="number" min="1" max="200" v-model.number="count">
            </label>
          </div>
          <div class="actions">
            <button class="btn primary" :disabled="starting || !subjectId" @click="startPractice">
              {{ starting ? '正在组卷…' : '开始练习' }}
            </button>
            <span class="muted small" v-if="examsLoading">考试类别加载中…</span>
            <span class="muted small" v-else-if="exams.length === 0">暂无可选考试类别</span>
          </div>
          <div class="alert bad" v-if="setupError">{{ setupError }}</div>
        </div>
      </section>

      <!-- ---------------- AI 学习计划 ---------------- -->
      <section v-else-if="tab === 'plan'">
        <div class="page-head">
          <h2>AI 学习计划</h2>
          <p>结合你的错题本与学情薄弱点，定制分日复习与提分排期</p>
        </div>

        <div class="card" v-if="todayPlanLoading">
          <div class="empty sm">今日基础计划加载中…</div>
        </div>
        <div class="card" v-else-if="todayPlan">
          <div class="q-top">
            <div>
              <div class="card-title" style="margin-bottom:2px">今日打卡进度</div>
              <div class="sub" style="margin:0">已完成 {{ todayPlan.doneCount || 0 }} / {{ todayPlan.plannedCount || 0 }} 题（{{ todayPlan.completionPercent || 0 }}%）</div>
            </div>
            <div style="display:flex;gap:8px;align-items:center">
              <input type="number" min="5" max="100" v-model.number="planConfig.dailyTarget" style="width:76px;border:1px solid var(--line);border-radius:8px;padding:6px 8px">
              <button class="btn sm" :disabled="planTargetSaving" @click="savePlanTarget">{{ planTargetSaving ? '保存中…' : '更新每日目标' }}</button>
            </div>
          </div>
          <div class="progressbar"><i :style="{ width: clampPct(todayPlan.completionPercent) + '%' }"></i></div>
          <div class="subtip" v-for="(n, idx) in (todayPlan.notes || [])" :key="idx">· {{ n }}</div>
        </div>

        <div class="card">
          <div class="card-title">根据我的错题 AI 制定学习计划</div>
          <div class="sub">系统会读取你错题本中未掌握的高频错题、错因与知识点分布来排期；若大模型繁忙会自动降级为规则引擎</div>
          <div class="form-grid">
            <label class="field">
              <span>规划天数（1–14 天）</span>
              <input type="number" min="1" max="14" v-model.number="planConfig.days">
            </label>
            <label class="field">
              <span>每日目标题量（5–100）</span>
              <input type="number" min="5" max="100" v-model.number="planConfig.dailyTarget">
            </label>
            <label class="field">
              <span>限定科目（可选）</span>
              <select v-model="planConfig.subjectId">
                <option :value="null">综合全部科目错题</option>
                <option v-for="s in subjects" :key="s.id" :value="s.id">{{ s.name }}</option>
              </select>
            </label>
            <label class="field full">
              <span>备考目标补充（可选，不超过 120 字）</span>
              <input v-model.trim="planConfig.goalNote" maxlength="120" placeholder="例如：下周考四级，重点攻克阅读长难句与错题二刷">
            </label>
          </div>
          <div class="actions">
            <button class="btn primary" :disabled="aiPlanLoading" @click="generateAiPlan">
              {{ aiPlanLoading ? 'AI 规划中…' : '生成 AI 错题学习计划' }}
            </button>
          </div>
          <div class="loading" v-if="aiPlanLoading">
            <span class="spinner"></span>
            <span>正在分析你的错题记录并生成分日学习计划，通常需要 10–45 秒…</span>
          </div>
          <div class="alert bad" v-if="aiPlanError">{{ aiPlanError }}</div>
        </div>

        <template v-if="aiPlan">
          <div class="card">
            <div class="ai-top">
              <span class="tag">{{ aiPlan.generator === 'rule-fallback' ? '规则引擎计划' : genLabel(aiPlan.generator) }}</span>
              <span class="tag ghost">错题 {{ aiPlan.wrongTotal || 0 }} 道</span>
              <span class="tag ghost">到期复习 {{ aiPlan.dueReviewCount || 0 }} 道</span>
              <span class="tag warn" v-if="aiPlan.degraded">降级生成</span>
              <span class="muted small" v-if="aiPlan.generatedAt">{{ aiPlan.generatedAt }}</span>
            </div>
            <div class="subtip" v-if="aiPlan.degraded && aiPlan.degradedReason" style="margin-bottom:8px">降级说明：{{ aiPlan.degradedReason }}</div>
            <div class="card-title" style="font-size:15px">错题诊断</div>
            <div class="answer">{{ aiPlan.diagnosis }}</div>

            <div v-if="(aiPlan.weakPoints || []).length" style="margin-top:16px">
              <div class="card-title" style="font-size:15px">高频薄弱点（{{ aiPlan.weakPoints.length }}）</div>
              <div class="w-analysis" v-for="(w, i) in aiPlan.weakPoints" :key="i" style="margin-top:8px">
                <strong>{{ w.knowledgeName }} · 错题 {{ w.wrongQuestionCount || 0 }} 道（最高错 {{ w.maxWrongCount || 1 }} 次）</strong>
                <p>{{ w.suggestion }}</p>
              </div>
            </div>
          </div>

          <div class="card" v-for="day in (aiPlan.dailySchedule || [])" :key="day.day">
            <div class="q-top">
              <div class="card-title" style="margin:0">{{ day.title || ('第 ' + day.day + ' 天') }}</div>
              <span class="tag ghost">Day {{ day.day }}</span>
            </div>
            <div class="sub" style="margin-top:4px">{{ day.focus }}</div>
            <div class="w-analysis" v-for="(tk, j) in (day.tasks || [])" :key="j" style="margin-top:8px">
              <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
                <strong>[{{ planTaskTypeLabel(tk.type) }}] {{ tk.title }} · {{ tk.targetCount }} 题（约 {{ tk.estimatedMinutes }} 分钟）</strong>
                <button class="btn ghost sm" @click="goPlanTask(tk)">去完成</button>
              </div>
              <p>{{ tk.reason }}</p>
              <div class="subtip" v-if="(tk.questionIds || []).length">关联错题 ID：{{ tk.questionIds.join(', ') }}</div>
            </div>
          </div>

          <div class="card" v-if="(aiPlan.tips || []).length">
            <div class="card-title" style="font-size:15px">备考建议</div>
            <div class="subtip" v-for="(tp, k) in aiPlan.tips" :key="k" style="font-size:14px;color:var(--text);margin-top:6px">· {{ tp }}</div>
          </div>
        </template>
      </section>

      <!-- ---------------- 模拟考试 ---------------- -->
      <section v-else-if="tab === 'mock'">
        <div class="page-head">
          <h2>模拟考试</h2>
          <p>按考试规格组卷、限时作答、交卷出分</p>
        </div>

        <!-- 成绩报告 -->
        <div class="card" v-if="mockReport">
          <div class="card-title">模拟考试成绩报告</div>
          <div class="sub">
            <span v-if="mockReport.status === 'FINISHED'">已交卷</span>
            <span v-if="mockReport.expired"> · 超时自动交卷</span>
          </div>
          <div class="stat-grid">
            <div class="stat"><div class="n">{{ fmtScore(mockReport.gotScore) }}</div><div class="l">得分 / {{ mockReport.totalScore == null ? '-' : mockReport.totalScore }}</div></div>
            <div class="stat ok"><div class="n">{{ fmtRate(mockReport.scoreRate) }}%</div><div class="l">得分率</div></div>
            <div class="stat"><div class="n">{{ mockReport.correctCount || 0 }}</div><div class="l">答对</div></div>
            <div class="stat"><div class="n">{{ mockReport.answeredCount || 0 }} / {{ mockReport.totalCount || 0 }}</div><div class="l">已答 / 总题数</div></div>
          </div>
          <div v-if="mockWrongList.length" style="margin-top:14px">
            <div class="card-title" style="font-size:15px">错题（{{ mockWrongList.length }}）</div>
            <div class="ref-box" v-for="(it, i) in mockWrongList" :key="i" style="margin-top:8px">
              <b>{{ i + 1 }}. [{{ it.typeName || it.type }}]</b>
              <p style="margin:4px 0 0">{{ it.stem }}</p>
              <div class="subtip">你的答案：{{ it.userAnswer || '—' }} · 正确答案：{{ it.correctAnswer || '—' }}</div>
            </div>
          </div>
          <div class="actions">
            <button class="btn primary" @click="resetMock">返回组卷</button>
          </div>
        </div>

        <!-- 答题 -->
        <div class="card" v-else-if="mockPaper && mockPaper.questions && mockPaper.questions.length">
          <div class="q-top">
            <div class="q-meta">
              <span class="tag">{{ mockCurrent.typeName || mockCurrent.type }}</span>
              <span class="tag ghost">{{ mockPaper.paperName || '模拟卷' }}</span>
            </div>
            <div class="q-progress" :style="{ color: mockRemainSec <= 60 ? '#c0392b' : '' }">剩余 {{ mockTimeText }}</div>
          </div>
          <div class="progressbar"><i :style="{ width: mockProgressPct + '%' }"></i></div>
          <div class="q-meta" style="margin-top:8px">第 {{ mockIndex + 1 }} / {{ mockPaper.questions.length }} 题</div>

          <div class="material" v-if="mockCurrent.material">{{ mockCurrent.material }}</div>
          <div class="stem">{{ mockCurrent.stem }}</div>

          <div class="options" v-if="mockCurrent.options && mockCurrent.options.length">
            <label class="opt" v-for="o in mockCurrent.options" :key="o.key"
                   :class="{ sel: mockIsSelected(o.key) }">
              <input v-if="mockCurrent.type === 'MULTI_CHOICE'" type="checkbox" :value="o.key" v-model="mockMulti">
              <input v-else type="radio" :value="o.key" v-model="mockAnswer">
              <span class="opt-key">{{ o.key }}</span>
              <span class="opt-content">{{ o.content }}</span>
            </label>
          </div>
          <div class="options" v-else-if="mockCurrent.type === 'TRUE_FALSE'">
            <label class="opt" v-for="v in ['正确','错误']" :key="v" :class="{ sel: mockAnswer === v }">
              <input type="radio" :value="v" v-model="mockAnswer">
              <span class="opt-key">{{ v === '正确' ? 'T' : 'F' }}</span>
              <span class="opt-content">{{ v }}</span>
            </label>
          </div>
          <div class="answer-area" v-else>
            <input class="ai-input" style="min-height:0;padding:11px 12px" v-model="mockAnswer"
                   placeholder="填空多个空用竖线分隔；主观题请在此作答">
          </div>

          <div class="actions">
            <button class="btn" :disabled="mockIndex === 0" @click="mockPrev">上一题</button>
            <button class="btn" :disabled="mockIndex >= mockPaper.questions.length - 1" @click="mockNext">下一题</button>
            <button class="btn primary" :disabled="mockSubmitting" @click="confirmMockSubmit">{{ mockSubmitting ? '交卷中…' : '交卷' }}</button>
          </div>
          <div class="chips" style="margin-top:12px">
            <button class="chip" v-for="(q, i) in mockPaper.questions" :key="q.id"
                    :class="{ on: i === mockIndex, done: !!mockAnswers[q.id] }"
                    @click="mockIndex = i; fillMockInput()">{{ i + 1 }}</button>
          </div>
          <div class="subtip" style="margin-top:6px">答题卡：绿色为已作答，蓝色为当前题</div>
          <div class="alert bad" v-if="mockError">{{ mockError }}</div>
        </div>

        <!-- 智能诊断测评 -->
        <div class="card" v-if="!mockPaper && !mockReport">
          <div class="card-title">智能诊断测评</div>
          <div class="sub">按薄弱知识点优先 + 难度梯度（基础 30% / 中等 50% / 拔高 20%）自动组卷，并避开近 14 天已掌握题</div>
          <div class="actions">
            <button class="btn primary" :disabled="diagStarting || mockStarting" @click="startDiagnostic">
              {{ diagStarting ? '组卷中…' : '生成诊断卷（20 题 / 30 分钟）' }}
            </button>
            <button class="btn ghost" @click="loadAssessmentProfile">查看能力画像</button>
          </div>
          <div class="alert bad" v-if="diagError">{{ diagError }}</div>

          <div v-if="assessmentProfile" style="margin-top:12px">
            <div class="stat-grid">
              <div class="stat"><div class="n">{{ assessmentProfile.overview.practiceSessions || 0 }}</div><div class="l">近30天练习场次</div></div>
              <div class="stat ok"><div class="n">{{ fmtRate(assessmentProfile.overview.accuracy) }}%</div><div class="l">近30天正确率</div></div>
              <div class="stat"><div class="n">{{ assessmentProfile.interview.finishedCount || 0 }}</div><div class="l">已完成 AI 面试</div></div>
              <div class="stat"><div class="n">{{ (assessmentProfile.weakTop5 || []).length }}</div><div class="l">薄弱知识点</div></div>
            </div>
            <div v-if="(assessmentProfile.weakTop5 || []).length" style="margin-top:10px">
              <div class="card-title" style="font-size:15px">薄弱知识点 Top5</div>
              <div class="kv" v-for="w in assessmentProfile.weakTop5" :key="w.knowledgeId">
                <span>{{ w.knowledgeName || ('知识点 ' + w.knowledgeId) }}</span>
                <b class="bad-text">掌握度 {{ fmtRate(Number(w.mastery) * 100) }}% · 作答 {{ w.attempts }} 次</b>
              </div>
            </div>
            <div v-if="(assessmentProfile.subjects || []).length" style="margin-top:10px">
              <div class="card-title" style="font-size:15px">科目掌握度</div>
              <div class="kv" v-for="sub in assessmentProfile.subjects" :key="sub.subjectId">
                <span>{{ sub.subjectName || ('科目 ' + sub.subjectId) }}</span>
                <b>{{ fmtRate(sub.accuracy) }}%（{{ sub.correct }}/{{ sub.answered }}）</b>
              </div>
            </div>
            <div class="actions">
              <button class="btn primary sm" @click="goPlanFromProfile">据此生成提分计划</button>
            </div>
          </div>
        </div>

        <!-- 固定套卷 -->
        <div class="card" v-if="!mockPaper && !mockReport">
          <div class="q-top">

              <select v-model="mockConfig.examCode" :disabled="examCategoriesLoading">

              </span>

            <label class="field">

              <select v-model="mockConfig.year" :disabled="yearsLoading">

          <div class="alert bad" v-if="mockSetupError">{{ mockSetupError }}</div>

      <!-- ---------------- 错题本 ---------------- -->
      <section v-else-if="tab === 'wrong'">

          <h2>错题本</h2>

        </div>
        <div class="card" v-if="wrongLoading">
          <div class="empty sm">加载中…</div>
        </div>
        <div class="card" v-else-if="wrongError">
          <div class="alert bad" style="margin:0">{{ wrongError }}</div>
          <div class="actions"><button class="btn sm" @click="loadWrong">重新加载</button></div>
        </div>
        <template v-else-if="wrongList.length">
          <div class="card" style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
            <span class="muted small">共 {{ wrongList.length }} 道未掌握错题，可让 AI 结合你的错题与薄弱点生成专属提分计划</span>
            <button class="btn primary sm" @click="goAiPlanFromWrong">AI 制定错题学习计划</button>
          </div>
          <div class="card w-item" v-for="it in wrongList" :key="it.questionId">
            <div class="w-top">
              <span class="tag">{{ it.typeName || it.type }}</span>
              <button class="btn ghost sm" @click="removeWrong(it)">移除</button>
            </div>
            <div class="w-stem">{{ it.stem }}</div>
            <div class="kv"><span>正确答案</span><b class="ok-text">{{ it.correctAnswer || (['SINGLE_CHOICE','MULTI_CHOICE','TRUE_FALSE','FILL_BLANK','MATCHING','ORDERING'].indexOf(it.type) >= 0 ? '—' : '主观题') }}</b></div>

            <div class="w-analysis" v-if="it.analysis">
              <strong>解析</strong>
              <p>{{ it.analysis }}</p>
            </div>
          </div>
          <div class="foot">共 {{ wrongList.length }} 道未掌握错题</div>
        </template>
        <div class="card" v-else>
          <div class="empty">
            <div class="icon">✓</div>
            错题本还是空的，先去做一组练习吧
            <div class="actions" style="justify-content:center">
              <button class="btn sm" @click="switchTab('practice')">去练习</button>
            </div>
          </div>
        </div>
      </section>

      <!-- ---------------- 学习统计 ---------------- -->
      <section v-else-if="tab === 'stats'">
        <div class="page-head">
          <h2>学习统计</h2>
          <p>看看最近的练习量、正确率和知识点掌握情况</p>
        </div>

        <div class="card" v-if="statsLoading">
          <div class="empty sm">统计加载中…</div>
        </div>

        <template v-else>
          <div class="card" v-if="stats">
            <div class="card-title">总览</div>
            <div class="sub">数据来自你在本系统的全部作答记录</div>
            <div class="stat-grid">
              <div class="stat"><div class="n">{{ stats.practiceCount != null ? stats.practiceCount : 0 }}</div><div class="l">练习次数</div></div>
              <div class="stat"><div class="n">{{ stats.totalAnswered != null ? stats.totalAnswered : 0 }}</div><div class="l">累计答题</div></div>
              <div class="stat ok"><div class="n">{{ fmtRate(stats.accuracy) }}%</div><div class="l">累计正确率</div></div>
              <div class="stat bad"><div class="n">{{ stats.wrongBookCount != null ? stats.wrongBookCount : 0 }}</div><div class="l">待攻克错题</div></div>
            </div>
          </div>
          <div class="card" v-if="statsError">
            <div class="alert bad" style="margin:0">{{ statsError }}</div>
            <div class="actions"><button class="btn sm" @click="loadStats">重新加载</button></div>
          </div>

          <div class="card">
            <div class="card-title">近 7 天答题趋势</div>
            <div class="sub">柱高表示每天的答题量</div>

              <div class="bar-col" v-for="d in trend" :key="d.date">
                <div class="bar-num">{{ d.answered || 0 }}</div>
                <div class="bar-wrap">
                  <div class="bar" :class="{ empty: !d.answered }" :style="{ height: barHeight(d.answered) }" :title="d.date + ' 答对 ' + (d.correct || 0) + ' 题'"></div>
                </div>
                <div class="bar-date">{{ shortDate(d.date) }}</div>
              </div>
            </div>
            <div class="empty sm" v-else>近 7 天还没有答题记录</div>
          </div>

          <div class="card">
            <div class="card-title">知识点掌握度</div>
            <div class="sub">按正确率从低到高排列，优先补薄弱的</div>
            <template v-if="masteryItems.length">
              <div class="m-row" v-for="m in masteryItems" :key="m.knowledgeId">
                <div class="m-head">
                  <span>{{ m.knowledgeName || '未命名知识点' }}</span>
                  <span class="muted">{{ m.correct || 0 }}/{{ m.answered || 0 }} · {{ fmtRate(m.masteryRate) }}%</span>
                </div>
                <div class="m-bar"><i :class="rateClass(m.masteryRate)" :style="{ width: clampPct(m.masteryRate) + '%' }"></i></div>
              </div>
            </template>
            <div class="empty sm" v-else>还没有可统计的知识点掌握数据</div>
          </div>
        </template>
      </section>

      <!-- ---------------- AI 答疑 ---------------- -->
      <section v-else-if="tab === 'ai'">
        <div class="page-head">
          <h2>AI 答疑</h2>
          <p>基于站内已审核题库与资料的检索问答，答案附来源</p>
        </div>

        <div class="card">

                    placeholder="例如：值传递和地址传递有什么区别？"

          <div class="actions" style="margin-top:0">
            <button class="btn primary" :disabled="aiLoading || !aiQ.trim()" @click="ask">
              {{ aiLoading ? '思考中…' : '提问' }}
            </button>
            <span class="muted small">回答较慢时请耐心等待，不要重复提交</span>
          </div>
          <div class="loading" v-if="aiLoading">
            <span class="spinner"></span>
            <span>正在检索站内资料并生成回答，通常需要 10–60 秒，请稍候…</span>
          </div>
          <div class="alert bad" v-if="aiError">{{ aiError }}</div>
        </div>

        <div class="card" v-if="aiResult">

          </div>

              <span class="src-idx">{{ i + 1 }}</span>
              <div class="src-body">
                <div class="src-h">
                  <span class="src-name">{{ s.title || '未命名来源' }}</span>
                  <span class="tag ghost xs">{{ refTypeLabel(s.refType) }}</span>
                </div>
                <div class="src-snip" v-if="s.snippet">{{ s.snippet }}</div>
              </div>
            </div>
          </div>
          <div class="empty sm" v-else>本次回答没有可展示的来源</div>
        </div>

        <div class="card" v-else-if="!aiLoading">
          <div class="empty">
            <div class="icon">?</div>

        </div>

          <p>AI 面试官逐题追问并评分，题源来自「AI 大模型面试」（INTERVIEW）题库</p>

        <div class="card" v-if="ivView === 'report' && ivReport">
          <div class="card-title">本场面试报告</div>
          <div class="sub">
            <span class="tag">{{ ivReport.level || '—' }}</span>
            <span v-if="ivReport.degraded"> · 评分由降级模型给出（仍依据语料，非编造）</span>
          </div>
          <div class="stat-grid">
            <div class="stat"><div class="n">{{ fmtScore(ivReport.total_score) }}</div><div class="l">总分</div></div>
            <div class="stat ok"><div class="n">{{ (ivReport.per_question || []).length }}</div><div class="l">已评题数</div></div>

            <div class="card-title" style="font-size:15px">逐题评语</div>
            <div class="ref-box" v-for="(it, i) in ivReport.per_question" :key="i" style="margin-top:8px">
              <b>{{ i + 1 }}. {{ it.question || '题目' }}（{{ fmtScore(it.score) }} 分）</b>
              <p style="margin:4px 0 0">{{ it.comment || '—' }}</p>
            </div>
          </div>
          <div class="ref-box" v-if="(ivReport.strengths || []).length" style="margin-top:12px"><b>亮点</b>{{ (ivReport.strengths || []).join('、') }}</div>
          <div class="ref-box" v-if="(ivReport.weaknesses || []).length"><b>薄弱点</b>{{ (ivReport.weaknesses || []).join('、') }}</div>
          <div class="ref-box" v-if="(ivReport.suggestions || []).length"><b>改进建议</b>{{ (ivReport.suggestions || []).join('、') }}</div>

        <!-- 作答中 -->

            <div class="ref-box" v-if="(ivFeedback.hit_points || []).length"><b>命中要点</b>{{ (ivFeedback.hit_points || []).join('、') }}</div>

              <div class="w-top">
                <span class="tag">{{ h.topic || '随机主题' }}</span>
                <button class="btn ghost sm" @click="loadInterviewDetail(h.id)">复盘</button>
              </div>
              <div class="kv">
                <span>状态</span><b>{{ h.finished === 1 ? '已结束' : '进行中' }}</b>
                <span>题数</span><b>{{ h.answeredCount || 0 }} / {{ h.totalQuestions || 0 }}</b>
                <span>总分</span><b>{{ h.totalScore == null ? '—' : fmtScore(h.totalScore) }}</b>
                <span>等级</span><b>{{ h.level || '—' }}</b>
              </div>
              <div class="subtip">{{ h.startedAt || '' }}</div>
            </div>
          </template>
          <div class="empty sm" v-else>暂无面试记录</div>
        </div>

        <!-- 复盘详情 -->
        <div class="card" v-if="ivDetail">
          <div class="card-title">面试复盘 · {{ ivDetail.topic || '随机主题' }}</div>
          <div class="sub"><button class="btn ghost sm" @click="ivDetail = null">收起</button></div>
          <div v-if="ivDetailLoading" class="empty sm">加载中…</div>
          <div v-else-if="ivDetailError" class="alert bad">{{ ivDetailError }}</div>
          <template v-else>
            <div class="ref-box" v-for="(qa, i) in (ivDetail.qaList || [])" :key="qa.id || i" style="margin-top:10px">
              <b>第 {{ qa.questionNo }} 题{{ qa.isFollowUp === 1 ? ' · 追问' : '' }}（{{ fmtScore(qa.score) }} 分 · {{ qa.verdict || '—' }}）</b>
              <p style="margin:4px 0 0">问：{{ qa.question }}</p>
              <p style="margin:4px 0 0">答：{{ qa.answer }}</p>
              <div class="subtip" v-if="(qa.hitPoints || []).length">命中：{{ (qa.hitPoints || []).join('、') }}</div>
              <div class="subtip" v-if="(qa.missPoints || []).length">遗漏：{{ (qa.missPoints || []).join('、') }}</div>
              <div class="subtip" v-if="qa.reference">参考：{{ qa.reference }}</div>
            </div>
            <div class="empty sm" v-if="!(ivDetail.qaList || []).length">该记录暂无逐题明细</div>
          </template>
        </div>
      </section>

      <div class="foot">ExamPilot · 学生端 · 数据实时来自后端</div>
    </main>
  </template>
</div>

<script src="../admin/vendor/vue.global.prod.js"></script>
<script src="../admin/vendor/element-plus.full.min.js"></script>
<script src="../admin/vendor/element-icons.min.js"></script>
<script>
(function () {
  'use strict';

  var API = '/api';
  var STORE_KEY = 'exam_prep_student_auth';

  /* examCode 枚举 → 中文名（后端 /questions/exam-categories 契约取值，前端仅做展示映射） */
  var EXAM_NAMES = {
    CET4: '四级', CET6: '六级',
    GUOKAO: '国考行测', GUOKAO_SHENLUN: '国考申论',
    POSTGRAD_ENG1: '考研英语一', POSTGRAD_ENG2: '考研英语二',
    POSTGRAD_MATH1: '考研数学一', POSTGRAD_MATH2: '考研数学二', POSTGRAD_MATH3: '考研数学三',
    INTERVIEW: 'AI大模型面试'
  };

  /* ---------------- 轻量提示（Element Plus 不可用时自动回退） ---------------- */
  function toast(message, type) {
    if (window.ElementPlus && ElementPlus.ElMessage) {
      ElementPlus.ElMessage({ message: message, type: type === 'error' ? 'error' : (type || 'info'), duration: 2600, offset: 90 });
      return;
    }
    var box = document.createElement('div');
    box.textContent = message;
    box.style.cssText = 'position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:9999;'
      + 'background:rgba(30,39,51,.92);color:#fff;padding:9px 16px;border-radius:9px;font-size:14px;'
      + 'max-width:86vw;box-shadow:0 6px 20px rgba(0,0,0,.18);';
    document.body.appendChild(box);
    setTimeout(function () { box.parentNode && box.parentNode.removeChild(box); }, 2600);
  }

  /* ---------------- 令牌读写 ---------------- */
  function readAuth() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return null;
      var obj = JSON.parse(raw);
      if (!obj || !obj.token) return null;
      return obj;
    } catch (e) { return null; }
  }
  function writeAuth(token, user) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify({ token: token, user: user || null })); } catch (e) {}
  }
  function clearAuth() {
    try { localStorage.removeItem(STORE_KEY); } catch (e) {}
  }

  /* ---------------- 请求封装 ---------------- */
  function makeRequest(getToken, onUnauthorized) {
    return function request(path, opts) {
      opts = opts || {};
      var method = opts.method || 'GET';
      var timeout = opts.timeout || 15000;
      var headers = {};
      if (opts.body !== undefined) headers['Content-Type'] = 'application/json';
      var token = opts.auth === false ? null : getToken();
      if (token) headers['Authorization'] = 'Bearer ' + token;
      var body = opts.body === undefined ? undefined : JSON.stringify(opts.body);

      var controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
      var timer = setTimeout(function () { controller && controller.abort(); }, timeout);

      return fetch(API + path, {
        method: method,
        headers: headers,
        body: body,
        signal: controller ? controller.signal : undefined
      }).then(function (res) {
        if (res.status === 401) {
          onUnauthorized();
          var err401 = new Error('登录已失效，请重新登录');
          err401.handled = true;
          throw err401;
        }
        return res.text().then(function (text) {
          var json = null;
          if (text) {
            try { json = JSON.parse(text); } catch (e) { throw new Error('服务返回异常（HTTP ' + res.status + '）'); }
          }
          if (!res.ok) {
            throw new Error((json && (json.message || json.msg)) || ('请求失败（HTTP ' + res.status + '）'));
          }
          if (!json || json.code !== 200) {
            throw new Error((json && json.message) || '请求失败');
          }
          return json.data;
        });
      }).catch(function (e) {
        if (e && e.name === 'AbortError') throw new Error('请求超时，请稍后重试');
        if (e instanceof TypeError) throw new Error('网络异常，请确认后端服务已启动');
        throw e;
      }).then(function (v) {
        clearTimeout(timer);
        return v;
      }, function (e) {
        clearTimeout(timer);
        throw e;
      });
    };
  }

  var saved = readAuth();

  var app = Vue.createApp({
    data: function () {
      return {
        request: null,
        token: saved ? saved.token : '',
        user: saved ? saved.user : null,

        loginForm: { studentNo: '2021001', password: '123456' },
        loginLoading: false,
        loginError: '',

        tabs: [
          { key: 'practice', label: '题库练习' },
          { key: 'wrong', label: '错题本' },
          { key: 'plan', label: 'AI 学习计划' },
          { key: 'mock', label: '模拟考试' },
          { key: 'stats', label: '学习统计' },
          { key: 'ai', label: 'AI 答疑' },
          { key: 'interview', label: '模拟面试' }
        ],
        tab: 'practice',

        exams: [],
        subjects: [],
        examId: null,
        subjectId: null,
        count: 20,
        practiceMode: 'RANDOM',
        practiceType: null,
        practiceYear: null,
        practiceModes: [
          { value: 'SEQUENCE', label: '顺序练习' },
          { value: 'RANDOM', label: '随机练习' },
          { value: 'BY_TYPE', label: '按题型' },
          { value: 'WRONG_BOOK', label: '错题重做' }
        ],
        practiceTypes: [
          { value: 'SINGLE_CHOICE', label: '单选题' },
          { value: 'MULTI_CHOICE', label: '多选题' },
          { value: 'TRUE_FALSE', label: '判断题' },
          { value: 'FILL_BLANK', label: '填空题' }
        ],
        /* 年份 / 类别选项全部来自接口动态加载，禁止硬编码 2015~2026 */
        yearOptions: [],
        yearsLoading: false,
        yearsError: '',
        examCategories: [],
        examCategoriesLoading: false,
        examCategoriesError: '',
        practiceExamCode: null,
        qStats: null,
        qStatsLoading: false,
        qStatsError: '',
        examsLoading: false,
        subjectsLoading: false,
        setupError: '',

        starting: false,
        practice: null,
        question: null,
        answer: '',
        multi: [],
        feedback: null,
        selfEvalDone: false,
        submitting: false,
        nexting: false,
        finishing: false,
        allDone: false,
        practiceError: '',
        report: null,
        currentSubjectName: '',

        wrongList: [],
        wrongLoading: false,
        wrongError: '',
        wrongLoaded: false,

        stats: null,
        statsLoading: false,
        statsError: '',
        trend: [],
        masteryItems: [],

        aiQ: '',
        aiLoading: false,
        aiError: '',
        aiResult: null,
        aiCostMillis: 0,

        /* ---------- AI 学习计划 ---------- */
        todayPlan: null,
        todayPlanLoading: false,
        planTargetSaving: false,
        planConfig: { days: 7, dailyTarget: 20, subjectId: null, goalNote: '' },
        aiPlan: null,
        aiPlanLoading: false,
        aiPlanError: '',

        /* ---------- 模拟考试 ---------- */
        mockConfig: { count: 20, durationMinutes: 60, year: null, examCode: null, questionType: null },
        mockStarting: false,
        mockSetupError: '',
        mockPaper: null,
        mockReport: null,
        mockIndex: 0,
        mockAnswers: {},
        mockAnswer: '',
        mockMulti: [],
        mockRemainSec: 0,
        mockTimerId: null,
        mockSubmitting: false,
        mockError: '',

        /* ---------- 智能诊断测评 ---------- */
        diagStarting: false,
        diagError: '',
        assessmentProfile: null,

        /* ---------- 固定套卷 / 模考历史 ---------- */
        mockPapers: [],
        mockPapersLoading: false,
        mockPapersError: '',
        mockHistory: [],
        mockHistoryTotal: 0,
        mockHistoryPage: 1,
        mockHistoryLoading: false,
        mockHistoryError: '',

        /* ---------- 模拟面试 ---------- */
        ivView: 'setup',
        ivTopics: [],
        ivTopicsLoading: false,
        ivTopicsError: '',
        ivTopic: '',
        ivTopicInput: '',
        ivTopicLabel: '',
        ivTotal: 3,
        ivStarting: false,
        ivError: '',
        ivSessionId: '',
        ivQuestion: '',
        ivQuestionNo: 0,
        ivTotalQ: 0,
        ivSource: null,
        ivAnswer: '',
        ivSubmitting: false,
        ivFeedback: null,
        ivReport: null,
        ivHistory: [],
        ivHistoryLoading: false,
        ivHistoryError: '',
        ivDetail: null,
        ivDetailLoading: false,
        ivDetailError: ''
      };
    },

    computed: {
      hasOptions: function () {
        return !!(this.question && this.question.options && this.question.options.length);
      },
      isMulti: function () {
        return !!(this.question && this.question.type === 'MULTI_CHOICE');
      },
      questionIndex: function () {
        if (!this.practice) return 1;
        return Math.min((this.practice.answeredCount || 0) + 1, this.practice.totalCount || 1);
      },
      progressPct: function () {
        if (!this.practice || !this.practice.totalCount) return 0;
        var pct = ((this.practice.answeredCount || 0) / this.practice.totalCount) * 100;
        return Math.max(0, Math.min(100, Math.round(pct)));
      },
      fbClass: function () {
        if (!this.feedback) return '';
        if (!this.feedback.judged) return 'warn';
        return this.feedback.correct ? 'ok' : 'bad';
      },
      selfEvalLabel: function () {
        if (!this.feedback) return '';
        var map = { KNOW: '会了', UNSURE: '有点模糊', DONT_KNOW: '不会' };
        return map[this.feedback.selfEvalResult] || '';
      },
      costText: function () {
        var ms = this.aiCostMillis;
        if (!ms) return '';
        if (ms < 1000) return '耗时 ' + ms + ' 毫秒';
        return '耗时 ' + (ms / 1000).toFixed(1) + ' 秒';
      },
      mockCurrent: function () {
        if (!this.mockPaper || !this.mockPaper.questions) return {};
        return this.mockPaper.questions[this.mockIndex] || {};
      },
      mockTimeText: function () {
        var s = Math.max(0, Number(this.mockRemainSec) || 0);
        var m = Math.floor(s / 60);
        var ss = s % 60;
        return (m < 10 ? '0' : '') + m + ':' + (ss < 10 ? '0' : '') + ss;
      },
      mockProgressPct: function () {
        var total = this.mockPaper && this.mockPaper.questions ? this.mockPaper.questions.length : 0;
        if (!total) return 0;
        var done = Object.keys(this.mockAnswers || {}).length;
        return Math.max(0, Math.min(100, Math.round(done / total * 100)));
      },
      mockWrongList: function () {
        var list = this.mockReport && this.mockReport.details ? this.mockReport.details : [];
        return list.filter(function (it) { return it && it.correct === false; });
      },
      qStatsByExamCode: function () {
        return this.distRows(this.qStats && this.qStats.byExamCode, true);
      },
      qStatsByYear: function () {
        return this.distRows(this.qStats && this.qStats.byYear, false);
      },
      ivProgressPct: function () {
        var total = Number(this.ivTotalQ) || Number(this.ivTotal) || 1;
        var cur = Number(this.ivQuestionNo) || 1;
        return Math.max(0, Math.min(100, Math.round((cur - 1) / total * 100)));
      }
    },

    mounted: function () {
      var self = this;
      this.request = makeRequest(function () { return self.token; }, function () { self.forceLogout(); });
      if (this.token) {
        this.loadExams();
        this.refreshMe();
        this.tryResumeMock();
        this.loadExamCategories();
        this.loadYears();
        this.loadQStats();
      }
    },

    beforeUnmount: function () {
      this.stopMockTimer();
    },

    methods: {
      /* ---------- 认证 ---------- */
      onUnauthorized: function () {},

      forceLogout: function (silent) {
        clearAuth();
        this.token = '';
        this.user = null;
        this.report = null;
        this.question = null;
        this.practice = null;
        this.feedback = null;
        this.allDone = false;
        this.wrongList = [];
        this.wrongLoaded = false;
        this.stats = null;
        this.trend = [];
        this.masteryItems = [];
        this.aiResult = null;
        this.todayPlan = null;
        this.aiPlan = null;
        this.aiPlanError = '';
        this.tab = 'practice';
        if (!silent) toast('登录已失效，请重新登录', 'error');
      },

      logout: function () {
        this.forceLogout(true);
        toast('已退出登录');
      },

      doLogin: function () {
        if (this.loginLoading) return;
        var no = (this.loginForm.studentNo || '').trim();
        var pwd = this.loginForm.password || '';
        if (!no) { this.loginError = '请输入学号'; return; }
        if (!pwd) { this.loginError = '请输入密码'; return; }
        var self = this;
        this.loginLoading = true;
        this.loginError = '';
        this.request('/auth/login', {
          method: 'POST',
          auth: false,
          body: { studentNo: no, password: pwd }
        }).then(function (data) {
          if (!data || !data.token) throw new Error('登录响应异常，未获取到令牌');
          self.token = data.token;
          self.user = data.user || null;
          writeAuth(data.token, data.user || null);
          toast('欢迎回来，' + ((data.user && data.user.nickname) || no));
          self.loadExams();
          self.loadExamCategories();
          self.loadYears();
          self.loadQStats();
        }).catch(function (e) {
          self.loginError = e.message || '登录失败';
        }).then(function () {
          self.loginLoading = false;
        });
      },

      refreshMe: function () {
        var self = this;
        this.request('/auth/me').then(function (u) {
          if (u) {
            self.user = u;
            writeAuth(self.token, u);
          }
        }).catch(function () { /* 401 已在 request 内处理，其它错误忽略 */ });
      },

      /* ---------- 题库选择 ---------- */
      loadExams: function () {
        var self = this;
        this.examsLoading = true;
        this.request('/exams', { auth: false }).then(function (list) {
          self.exams = Array.isArray(list) ? list : [];
          if (self.exams.length && self.examId == null) {
            self.examId = self.exams[0].id;
            self.loadSubjects();
          }
        }).catch(function (e) {
          self.setupError = e.message || '考试类别加载失败';
        }).then(function () {
          self.examsLoading = false;
        });
      },

      onExamChange: function () {
        this.subjectId = null;
        this.subjects = [];
        this.setupError = '';
        this.loadSubjects();
      },

      loadSubjects: function () {
        if (!this.examId) return;
        var self = this;
        this.subjectsLoading = true;
        this.request('/subjects?examCategoryId=' + encodeURIComponent(this.examId), { auth: false })
          .then(function (list) {
            self.subjects = Array.isArray(list) ? list : [];
          })
          .catch(function (e) {
            self.subjects = [];
            self.setupError = e.message || '科目加载失败';
          })
          .then(function () {
            self.subjectsLoading = false;
          });
      },

      /* ---------- 练习 ---------- */
      startPractice: function () {
        if (!this.subjectId || this.starting) return;
        if (this.practiceMode === 'BY_TYPE' && !this.practiceType) {
          this.setupError = '按题型练习请先选择题型';
          return;
        }
        var self = this;
        this.starting = true;
        this.setupError = '';
        this.report = null;
        this.allDone = false;
        this.feedback = null;
        this.answer = '';
        this.multi = [];
        this.practiceError = '';

        var subject = this.subjects.filter(function (s) { return s.id === self.subjectId; })[0];
        this.currentSubjectName = subject ? subject.name : '';

        var reqBody = {
          subjectId: this.subjectId,
          mode: this.practiceMode || 'RANDOM',
          count: Math.max(1, Math.min(200, Number(this.count) || 20))
        };
        if (this.practiceMode === 'BY_TYPE' && this.practiceType) reqBody.questionType = this.practiceType;
        if (this.practiceYear) reqBody.year = Number(this.practiceYear);
        if (this.practiceExamCode) reqBody.examCode = this.practiceExamCode;
        this.request('/practice/start', {
          method: 'POST',
          body: reqBody
        }).then(function (data) {
          if (!data || !data.question) {
            self.setupError = '该科目暂无可用题目，请换一个科目试试';
            return;
          }
          self.practice = {
            practiceId: data.practiceId,
            totalCount: data.totalCount || 1,
            answeredCount: data.answeredCount || 0
          };
          self.question = data.question;
          self.answer = '';
          self.multi = [];
          self.feedback = null;
          self.selfEvalDone = false;
        }).catch(function (e) {
          self.setupError = e.message || '开始练习失败';
        }).then(function () {
          self.starting = false;
        });
      },

      isSelected: function (key) {
        if (this.isMulti) return this.multi.indexOf(key) >= 0;
        return this.answer === key;
      },

      buildAnswer: function () {
        if (this.isMulti) return this.multi.slice().sort().join(',');
        return (this.answer || '').trim();
      },

      submitAnswer: function () {
        if (!this.question || !this.practice || this.submitting || this.feedback) return;
        var payload = this.buildAnswer();
        if (!payload) { this.practiceError = '请先作答再提交'; return; }
        this.practiceError = '';
        var self = this;
        this.submitting = true;

        this.request('/practice/' + this.practice.practiceId + '/answer', {
          method: 'POST',
          body: { questionId: this.question.id, userAnswer: payload }
        }).then(function (data) {
          var fb = data || {};
          fb.selfEvalResult = '';
          self.feedback = fb;
          self.selfEvalDone = false;
          if (fb.answeredCount != null) self.practice.answeredCount = fb.answeredCount;
          if (fb.totalCount != null) self.practice.totalCount = fb.totalCount;
        }).catch(function (e) {
          self.practiceError = e.message || '提交失败';
        }).then(function () {
          self.submitting = false;
        });
      },

      doSelfEval: function (result) {
        if (!this.question || !this.practice) return;
        var self = this;
        this.request('/practice/' + this.practice.practiceId + '/self-eval', {
          method: 'POST',
          body: { questionId: this.question.id, result: result }
        }).then(function (data) {
          self.feedback.selfEvalResult = result;
          self.selfEvalDone = true;
          if (data && data.answeredCount != null) self.practice.answeredCount = data.answeredCount;
          toast('自评已记录');
        }).catch(function (e) {
          toast(e.message || '自评失败', 'error');
        });
      },

      nextQuestion: function () {
        if (!this.practice || this.nexting) return;
        var self = this;
        this.nexting = true;
        this.practiceError = '';

        this.request('/practice/' + this.practice.practiceId + '/next').then(function (data) {
          if (!data || data.finished || !data.question) {
            self.question = null;
            self.allDone = true;
            self.feedback = null;
            if (data && data.answeredCount != null) self.practice.answeredCount = data.answeredCount;
            if (data && data.totalCount != null) self.practice.totalCount = data.totalCount;
            return;
          }
          self.question = data.question;
          self.answer = '';
          self.multi = [];
          self.feedback = null;
          self.selfEvalDone = false;
          if (data.answeredCount != null) self.practice.answeredCount = data.answeredCount;
          if (data.totalCount != null) self.practice.totalCount = data.totalCount;
        }).catch(function (e) {
          self.practiceError = e.message || '获取下一题失败';
        }).then(function () {
          self.nexting = false;
        });
      },

      finishPractice: function () {
        if (!this.practice || this.finishing) return;
        var self = this;
        this.finishing = true;
        this.practiceError = '';
        var pid = this.practice.practiceId;

        this.request('/practice/' + pid + '/finish', { method: 'POST' }).then(function (data) {
          self.report = data || {};
          self.question = null;
          self.feedback = null;
          self.allDone = false;
          self.practice = null;
          self.wrongLoaded = false;
          toast('本次练习已结束');
        }).catch(function (e) {
          self.practiceError = e.message || '结束练习失败';
        }).then(function () {
          self.finishing = false;
        });
      },

      resetPractice: function () {
        this.report = null;
        this.question = null;
        this.feedback = null;
        this.practice = null;
        this.allDone = false;
        this.answer = '';
        this.multi = [];
        this.selfEvalDone = false;
        this.practiceError = '';
        this.setupError = '';
      },

      /* ---------- 错题本 ---------- */
      loadWrong: function () {
        var self = this;
        this.wrongLoading = true;
        this.wrongError = '';
        this.request('/wrong-book').then(function (list) {
          self.wrongList = Array.isArray(list) ? list : [];
          self.wrongLoaded = true;
        }).catch(function (e) {
          self.wrongError = e.message || '错题本加载失败';
        }).then(function () {
          self.wrongLoading = false;
        });
      },

      removeWrong: function (item) {
        var self = this;
        var pid = item.questionId;

      startMockTimer: function () {
        this.stopMockTimer();
        var self = this;
        this.mockTimerId = setInterval(function () {
          if (self.mockRemainSec > 0) {
            self.mockRemainSec -= 1;
          }
          if (self.mockRemainSec <= 0) {
            self.stopMockTimer();
            toast('考试时间到，正在自动交卷', 'error');
            self.doSelfMockSubmit();
          }
        }, 1000);

      stopMockTimer: function () {
        if (this.mockTimerId) {
          clearInterval(this.mockTimerId);
          this.mockTimerId = null;
        }
      },

      fillMockInput: function () {
        var q = this.mockCurrent || {};
        var saved = (this.mockAnswers || {})[q.id];
        if (q.type === 'MULTI_CHOICE') {
          this.mockMulti = saved ? String(saved).split(',').filter(Boolean) : [];
          this.mockAnswer = '';
        } else {
          this.mockAnswer = saved || '';
          this.mockMulti = [];
        }
      },

      mockIsSelected: function (key) {
        if ((this.mockCurrent || {}).type === 'MULTI_CHOICE') {
          return (this.mockMulti || []).indexOf(key) >= 0;
        }
        return this.mockAnswer === key;
      },

      mockBuildAnswer: function () {
        if ((this.mockCurrent || {}).type === 'MULTI_CHOICE') {
          return (this.mockMulti || []).slice().sort().join(',');
        }
        return String(this.mockAnswer || '').trim();
      },

      saveMockAnswer: function () {
        var q = this.mockCurrent || {};
        if (!q.id || !this.mockPaper) return Promise.resolve();
        var ans = this.mockBuildAnswer();
        if (!ans) return Promise.resolve();
        this.mockAnswers[q.id] = ans;
        return this.request('/exams/mock/' + this.mockPaper.recordId + '/answer', {
          method: 'POST',
          body: { questionId: q.id, userAnswer: ans }
        }).catch(function (e) {
          // 单题保存失败不阻断作答：交卷前 doSelfMockSubmit 会再保存当前题一次
          console.warn('mock answer save failed:', e && e.message);
        });
      },

      mockPrev: function () {
        if (this.mockIndex <= 0) return;
        var self = this;
        this.saveMockAnswer().then(function () {
          self.mockIndex -= 1;
          self.fillMockInput();
        });
      },

      mockNext: function () {
        if (!this.mockPaper || this.mockIndex >= this.mockPaper.questions.length - 1) return;
        var self = this;
        this.saveMockAnswer().then(function () {
          self.mockIndex += 1;
          self.fillMockInput();
        });
      },

      confirmMockSubmit: function () {
        if (this.mockSubmitting || !this.mockPaper) return;
        var total = this.mockPaper.questions ? this.mockPaper.questions.length : 0;
        var unanswered = Math.max(0, total - Object.keys(this.mockAnswers || {}).length);
        var msg = unanswered > 0
          ? ('还有 ' + unanswered + ' 题未作答，确定交卷吗？交卷后不可修改。')
          : '确定交卷吗？交卷后不可修改。';
        if (window.confirm(msg)) {
          this.doSelfMockSubmit();
        }
      },

        if (!this.mockPaper || this.mockSubmitting) return;
        var self = this;
        this.mockSubmitting = true;
        this.mockError = '';
        this.stopMockTimer();
        this.saveMockAnswer().then(function () {
          return self.request('/exams/mock/' + self.mockPaper.recordId + '/submit', { method: 'POST' });
        }).then(function () {
          return self.request('/exams/mock/' + self.mockPaper.recordId + '/report');
        }).then(function (report) {
          self.mockReport = report || {};
          self.mockPaper = null;
          self.saveMockRecordId(null);
          toast('已交卷');
          self.loadMockHistory(1);
        }).catch(function (e) {
          self.mockError = e.message || '交卷失败';
        }).then(function () {
          self.mockSubmitting = false;
        });

      examName: function (code) {

      /** 把 {k:count} 对象或 [{key,count}] 数组归一化成 [{key,label,count}] */
      distRows: function (v, isExam) {
        if (!v) return [];
        var self = this;
        var out = [];
        if (Array.isArray(v)) {
          v.forEach(function (it) {
            if (!it) return;
            var key = it.examCode != null ? it.examCode
              : (it.year != null ? String(it.year)
                : (it.key != null ? it.key : (it.name != null ? it.name : it.status)));
            var count = it.count != null ? it.count : (it.total != null ? it.total : it.value);
            if (key == null) return;
            out.push({ key: String(key), label: isExam ? self.examName(String(key)) : String(key), count: Number(count) || 0 });
          });
        } else if (typeof v === 'object') {
          Object.keys(v).forEach(function (k) {
            out.push({ key: k, label: isExam ? self.examName(k) : k, count: Number(v[k]) || 0 });
          });
        }
        return out;
      },
