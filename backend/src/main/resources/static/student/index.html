        this.todayPlanLoading = true;
        this.request('/me/study-plan').then(function (d) {
          self.todayPlan = d || null;
          if (d && d.dailyTarget) self.planConfig.dailyTarget = d.dailyTarget;
        }).catch(function () {
          self.todayPlan = null;
        }).then(function () {
          self.todayPlanLoading = false;
        });
      },

      savePlanTarget: function () {
        if (this.planTargetSaving) return;
        var self = this;
        var t = Math.max(5, Math.min(100, Number(this.planConfig.dailyTarget) || 20));
        this.planConfig.dailyTarget = t;
        this.planTargetSaving = true;
        this.request('/me/study-plan/target', {
          method: 'PUT',
          body: { dailyTarget: t, subjectId: this.planConfig.subjectId || null }
        }).then(function (d) {
          self.todayPlan = d || null;
          toast('每日目标已更新为 ' + (d && d.dailyTarget ? d.dailyTarget : t) + ' 题');
        }).catch(function (e) {
          toast(e.message || '更新目标失败', 'error');
        }).then(function () {
          self.planTargetSaving = false;
        });
      },

      generateAiPlan: function () {
        if (this.aiPlanLoading) return;
        var self = this;
        this.aiPlanLoading = true;
        this.aiPlanError = '';
        var cfg = this.planConfig || {};
        var body = {
          days: Math.max(1, Math.min(14, Number(cfg.days) || 7)),
          dailyTarget: Math.max(5, Math.min(100, Number(cfg.dailyTarget) || 20)),
          subjectId: cfg.subjectId || null,
          goalNote: (cfg.goalNote || '').trim() || null
        };
        this.request('/me/study-plan/ai', {
          method: 'POST',
          body: body,
          timeout: 180000
        }).then(function (d) {
          self.aiPlan = d || null;
          toast('学习计划已生成');
        }).catch(function (e) {
          self.aiPlanError = e.message || '生成 AI 学习计划失败';
        }).then(function () {
          self.aiPlanLoading = false;
        });
      },

      goAiPlanFromWrong: function () {
        this.switchTab('plan');
        this.generateAiPlan();
      },

      goPlanTask: function (tk) {
        var type = tk && tk.type;
        if (type === 'WRONG_REVIEW') {
          this.switchTab('wrong');
        } else if (type === 'MOCK_CHECK') {
          this.switchTab('mock');
        } else {
          this.switchTab('practice');
        }
      },

      planTaskTypeLabel: function (t) {
        var map = { WRONG_REVIEW: '错题复习', WEAK_PRACTICE: '薄弱练习', MOCK_CHECK: '模拟检验' };
        return map[t] || '学习任务';
      },

      /* ---------- 导航 ---------- */
      switchTab: function (key) {
        this.tab = key;
        if (key === 'wrong') this.loadWrong();
        if (key === 'plan') {
          this.loadTodayPlan();
          if (!this.subjects.length && this.exams.length) {
            this.examId = this.exams[0].id;
            this.onExamChange();
          }
        }
        if (key === 'stats') this.loadStats();
        if (key === 'mock') {
          this.loadMockPapers();
          this.loadMockHistory(1);
        }
        if (key === 'interview') {
          if (!this.ivTopics.length && !this.ivTopicsLoading) this.loadInterviewTopics();
          this.loadInterviewHistory();
        }
      },

      /* ---------- 展示辅助 ---------- */
      fmtRate: function (v) {
        if (v === null || v === undefined || v === '') return '0.0';
        var n = Number(v);
        if (isNaN(n)) return '0.0';
        return (Math.round(n * 10) / 10).toFixed(1);
      },
      clampPct: function (v) {
        var n = Number(v);
        if (isNaN(n)) n = 0;
        return Math.max(0, Math.min(100, n));
      },
      shortDate: function (d) {
        if (!d) return '';
        var s = String(d);
        return s.length >= 10 ? s.slice(5, 10) : s;
      },
      barHeight: function (v) {
        var n = Number(v) || 0;
        var max = 0;
        for (var i = 0; i < this.trend.length; i++) {
          var m = Number(this.trend[i].answered) || 0;
          if (m > max) max = m;
        }
        if (max <= 0) return '3px';
        var pct = (n / max) * 100;
        return (n === 0 ? 3 : Math.max(6, pct)) + '%';
      },
      rateClass: function (v) {
        var n = Number(v) || 0;
        if (n < 40) return 'vlow';
        if (n < 70) return 'low';
        return '';
      },
      refText: function (v) {
        if (v === null || v === undefined) return '';
        if (typeof v === 'string') return v;
        if (Array.isArray(v)) return v.map(function (x) { return (typeof x === 'string') ? x : JSON.stringify(x); }).join('\n');
        if (typeof v === 'object') {
          var keys = Object.keys(v);
          if (!keys.length) return '';
          return keys.map(function (k) { return k + '：' + (typeof v[k] === 'object' ? JSON.stringify(v[k]) : v[k]); }).join('\n');
        }
        return String(v);
      },
      genLabel: function (g) {
        var map = {
          extractive: '本地抽取',
          dashscope: '通义千问',
          zhipu: '智谱 GLM',
          wiki: '站内百科',
          none: '无生成器'
        };
        return map[g] || (g ? String(g) : 'AI 回答');
      },
      refTypeLabel: function (t) {
        var map = { QUESTION: '题目', RESOURCE: '资料', KNOWLEDGE: '知识点', WIKI: '百科', COURSE: '课程' };
        return map[t] || (t ? String(t) : '来源');
      }
    }
  });

  app.mount('#app');
})();
</script>
</body>
</html>
