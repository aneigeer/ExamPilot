<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>备考知识库 · 后台管理端</title>
<link rel="stylesheet" href="vendor/element-plus.css">
<script src="vendor/vue.global.prod.js"></script>
<script src="vendor/element-plus.full.min.js"></script>
<script src="vendor/element-icons.min.js"></script>
<style>
  html,body,#app{height:100%;margin:0;background:#f0f2f5}
  .login-box{width:380px;margin:12vh auto;padding:36px;background:#fff;border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,.08)}
  .login-title{text-align:center;font-size:20px;font-weight:600;margin-bottom:28px;color:#1b1f27}
  .aside{background:#001529;min-height:100vh}
  .logo{color:#fff;text-align:center;padding:18px 0;font-size:16px;font-weight:600;border-bottom:1px solid rgba(255,255,255,.08)}
  .head{background:#fff;padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:56px;box-shadow:0 1px 4px rgba(0,21,41,.08)}
  .page{padding:16px}
  .stat-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px}
  .stat-card{flex:1;min-width:150px;background:#fff;border-radius:8px;padding:18px;text-align:center}
  .stat-num{font-size:26px;font-weight:700;color:#2962FF}
  .stat-label{font-size:13px;color:#7a8190;margin-top:4px}
  .pager{margin-top:12px;display:flex;justify-content:flex-end}
  .stem-cell{max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<div id="app" v-cloak>

  <!-- ============ 登录 ============ -->
  <div v-if="!token" class="login-box">
    <div class="login-title">备考知识库 · 后台管理端</div>
    <el-form @submit.prevent="login">
      <el-form-item><el-input v-model="loginForm.studentNo" placeholder="账号（admin / auditor）" size="large"/></el-form-item>
      <el-form-item><el-input v-model="loginForm.password" type="password" placeholder="密码" size="large" show-password/></el-form-item>
      <el-button type="primary" size="large" style="width:100%" :loading="logging" @click="login">登 录</el-button>
    </el-form>
  </div>

  <!-- ============ 主布局 ============ -->
  <el-container v-else style="height:100vh">
    <el-aside width="210px" class="aside">
      <div class="logo">📚 备考知识库管理端</div>
      <el-menu :default-active="view" background-color="#001529" text-color="#a6adb4"
               active-text-color="#ffffff" style="border-right:none"
               @select="v => { view = v; loadView(); }">
        <el-menu-item index="dashboard">📊 仪表盘</el-menu-item>
        <el-menu-item index="questions">📝 题目审核</el-menu-item>
        <el-menu-item index="resources">📁 资料审核</el-menu-item>
        <el-menu-item index="reports">🚨 举报处理</el-menu-item>
        <el-menu-item index="appeals">⚖️ 申诉处理</el-menu-item>
        <el-menu-item index="users">👥 用户管理</el-menu-item>
        <el-menu-item index="announcements">📢 公告管理</el-menu-item>
        <el-menu-item index="data">🗂️ 基础数据</el-menu-item>
        <el-menu-item index="logs">📜 操作日志</el-menu-item>
      </el-menu>
    </el-aside>

    <el-container>
      <el-header class="head" height="56px">
        <span style="color:#7a8190;font-size:14px">大学生多考试备考知识库与题库系统 · 管理端</span>
        <span>
          <el-tag type="info" effect="plain" style="margin-right:10px">{{ whoami }}</el-tag>
          <el-button text type="danger" @click="logout">退出</el-button>
        </span>
      </el-header>

      <el-main style="padding:0;overflow:auto">

        <!-- ======== 仪表盘 ======== -->
        <div v-if="view==='dashboard'" class="page">
          <div class="stat-row">
            <div class="stat-card" v-for="(v,k) in dashboard" :key="k">
              <div class="stat-num">{{ v }}</div>
              <div class="stat-label">{{ dashLabel(k) }}</div>
            </div>
          </div>
          <el-row :gutter="14">
            <el-col :span="12">
              <el-card shadow="never"><template #header>资料类型分布</template>
                <div v-for="(v,k) in resourceTypes" :key="k" style="display:flex;justify-content:space-between;padding:6px 4px;border-bottom:1px dashed #eee">
                  <span>{{ k }}</span><el-tag size="small">{{ v }}</el-tag>
                </div>
              </el-card>
            </el-col>
            <el-col :span="12">
              <el-card shadow="never"><template #header>角色分布</template>
                <div v-for="(v,k) in roleStats" :key="k" style="display:flex;justify-content:space-between;padding:6px 4px;border-bottom:1px dashed #eee">
                  <span>{{ k }}</span><el-tag size="small" type="warning">{{ v }}</el-tag>
                </div>
              </el-card>
            </el-col>
          </el-row>
        </div>

        <!-- ======== 题目审核 ======== -->
        <div v-if="view==='questions'" class="page">
          <el-card shadow="never">
            <template #header>
              <div style="display:flex;gap:10px;align-items:center">
                <el-select v-model="qFilter.type" placeholder="全部题型" clearable style="width:160px" @change="loadQuestions">
                  <el-option v-for="t in questionTypes" :key="t.type" :label="t.label" :value="t.type"/>
                </el-select>
                <el-input v-model="qFilter.keyword" placeholder="题干关键词" style="width:220px" clearable @keyup.enter="loadQuestions"/>
                <el-button type="primary" @click="loadQuestions">查询</el-button>
              </div>
            </template>
            <el-table :data="questions" stripe>
              <el-table-column prop="id" label="ID" width="60"/>
              <el-table-column prop="typeName" label="题型" width="90"/>
              <el-table-column label="题干" show-overflow-tooltip><template #default="s">{{ s.row.stem }}</template></el-table-column>
              <el-table-column prop="difficulty" label="难度" width="60"/>
              <el-table-column prop="auditStatus" label="状态" width="90">
                <template #default="s"><el-tag :type="s.row.auditStatus==='PENDING'?'warning':'success'" size="small">{{ s.row.auditStatus }}</el-tag></template>
              </el-table-column>
              <el-table-column label="操作" width="160" fixed="right">
                <template #default="s">
                  <el-button v-if="s.row.auditStatus==='PENDING'" size="small" type="success" @click="auditQuestion(s.row.id,'approve')">通过</el-button>
                  <el-button v-if="s.row.auditStatus==='PENDING'" size="small" type="danger" @click="auditQuestion(s.row.id,'reject')">驳回</el-button>
                  <el-button v-if="s.row.auditStatus==='APPROVED'" size="small" type="warning" @click="auditQuestion(s.row.id,'offline')">下架</el-button>
                </template>
              </el-table-column>
            </el-table>
            <div class="pager"><el-pagination layout="prev, pager, next, total" :total="qTotal" :page-size="20"
              :current-page="qFilter.page" @current-change="p => { qFilter.page = p; loadQuestions(); }"/></div>
          </el-card>
        </div>

        <!-- ======== 资料审核 ======== -->
        <div v-if="view==='resources'" class="page">
          <el-card shadow="never">
            <template #header>
              <el-radio-group v-model="rFilter.audited" @change="loadResources">
                <el-radio-button :value="false">待审核</el-radio-button>
                <el-radio-button :value="true">已审核</el-radio-button>
              </el-radio-group>
            </template>
            <el-table :data="resources" stripe>
              <el-table-column prop="id" label="ID" width="60"/>
              <el-table-column label="标题" show-overflow-tooltip><template #default="s">{{ s.row.title }}</template></el-table-column>
              <el-table-column prop="typeName" label="类型" width="90"/>
              <el-table-column prop="subjectName" label="科目" width="130"/>
              <el-table-column prop="uploaderName" label="上传人" width="100"/>
              <el-table-column prop="auditStatus" label="状态" width="100">
                <template #default="s"><el-tag :type="statusTag(s.row.auditStatus)" size="small">{{ s.row.auditStatus }}</el-tag></template>
              </el-table-column>
              <el-table-column label="操作" width="210" fixed="right">
                <template #default="s">
                  <el-button v-if="s.row.auditStatus==='PENDING'" size="small" type="success" @click="auditResource(s.row.id,'approve')">通过</el-button>
                  <el-button v-if="s.row.auditStatus==='PENDING'" size="small" type="danger" @click="auditResource(s.row.id,'reject')">驳回</el-button>
                  <el-button v-if="s.row.auditStatus==='APPROVED'" size="small" type="warning" @click="auditResource(s.row.id,'offline')">下架</el-button>
                </template>
              </el-table-column>
            </el-table>
            <div class="pager"><el-pagination layout="prev, pager, next, total" :total="rTotal" :page-size="20"
              :current-page="rFilter.page" @current-change="p => { rFilter.page = p; loadResources(); }"/></div>
          </el-card>
        </div>

        <!-- ======== 举报处理 ======== -->
        <div v-if="view==='reports'" class="page">
          <el-card shadow="never">
            <template #header><el-radio-group v-model="repFilter.status" @change="loadReports">
              <el-radio-button value="">全部</el-radio-button>
              <el-radio-button value="PENDING">待处理</el-radio-button>
              <el-radio-button value="VALID">成立</el-radio-button>
              <el-radio-button value="INVALID">不成立</el-radio-button>
            </el-radio-group></template>
            <el-table :data="reports" stripe>
              <el-table-column prop="id" label="ID" width="60"/>
              <el-table-column prop="targetType" label="对象" width="100"/>
              <el-table-column prop="targetId" label="对象ID" width="80"/>
              <el-table-column label="理由" show-overflow-tooltip><template #default="s">{{ s.row.reason }}</template></el-table-column>
              <el-table-column prop="status" label="状态" width="90">
                <template #default="s"><el-tag :type="s.row.status==='PENDING'?'warning':(s.row.status==='VALID'?'danger':'info')" size="small">{{ s.row.status }}</el-tag></template>
              </el-table-column>
              <el-table-column prop="createdAt" label="时间" width="160"/>
              <el-table-column label="操作" width="200" fixed="right">
                <template #default="s">
                  <template v-if="s.row.status==='PENDING'">
                    <el-button size="small" type="danger" @click="handleReport(s.row.id,'VALID',true)">成立并下架</el-button>
                    <el-button size="small" @click="handleReport(s.row.id,'INVALID',false)">不成立</el-button>
                  </template>
                </template>
              </el-table-column>
            </el-table>
            <div class="pager"><el-pagination layout="prev, pager, next, total" :total="repTotal" :page-size="20"
              :current-page="repFilter.page" @current-change="p => { repFilter.page = p; loadReports(); }"/></div>
          </el-card>
        </div>

        <!-- ======== 申诉处理 ======== -->
        <div v-if="view==='appeals'" class="page">
          <el-card shadow="never">
            <template #header><el-radio-group v-model="appFilter.status" @change="loadAppeals">
              <el-radio-button value="PENDING">待处理</el-radio-button>
              <el-radio-button value="">全部</el-radio-button>
            </el-radio-group></template>
            <el-table :data="appeals" stripe>
              <el-table-column prop="id" label="ID" width="60"/>
              <el-table-column prop="userId" label="申诉人" width="80"/>
              <el-table-column label="对象" width="110"><template #default="s">{{ s.row.targetType }}#{{ s.row.targetId }}</template></el-table-column>
              <el-table-column label="理由" show-overflow-tooltip><template #default="s">{{ s.row.reason }}</template></el-table-column>
              <el-table-column prop="status" label="状态" width="100">
                <template #default="s"><el-tag :type="s.row.status==='PENDING'?'warning':(s.row.status==='APPROVED'?'success':'danger')" size="small">{{ s.row.status }}</el-tag></template>
              </el-table-column>
              <el-table-column label="操作" width="180" fixed="right">
                <template #default="s">
                  <template v-if="s.row.status==='PENDING'">
                    <el-button size="small" type="success" @click="handleAppeal(s.row.id,'approve')">通过恢复</el-button>
                    <el-button size="small" type="danger" @click="handleAppeal(s.row.id,'reject')">驳回</el-button>
                  </template>
                </template>
              </el-table-column>
            </el-table>
            <div class="pager"><el-pagination layout="prev, pager, next, total" :total="appTotal" :page-size="20"
              :current-page="appFilter.page" @current-change="p => { appFilter.page = p; loadAppeals(); }"/></div>
          </el-card>
        </div>

        <!-- ======== 用户管理 ======== -->
        <div v-if="view==='users'" class="page">
          <el-card shadow="never">
            <el-table :data="users" stripe>
              <el-table-column prop="id" label="ID" width="60"/>
              <el-table-column prop="maskedStudentNo" label="学号" width="140"/>
              <el-table-column prop="nickname" label="昵称" width="140"/>
              <el-table-column prop="role" label="角色" width="110">
                <template #default="s"><el-tag size="small">{{ s.row.role }}</el-tag></template>
              </el-table-column>
              <el-table-column prop="status" label="状态" width="90">
                <template #default="s"><el-tag :type="s.row.status===1?'success':'danger'" size="small">{{ s.row.status===1?'正常':'禁用' }}</el-tag></template>
              </el-table-column>
              <el-table-column prop="lastLoginAt" label="最近登录" width="170"/>
              <el-table-column label="操作" width="230" fixed="right">
                <template #default="s">
                  <el-select :model-value="s.row.role" size="small" style="width:110px" @change="v => changeRole(s.row, v)">
                    <el-option v-for="r in ['GUEST','STUDENT','AUDITOR','ADMIN']" :key="r" :label="r" :value="r"/>
                  </el-select>
                  <el-button size="small" :type="s.row.status===1?'danger':'success'" style="margin-left:8px"
                             @click="changeStatus(s.row)">{{ s.row.status===1?'禁用':'启用' }}</el-button>
                </template>
              </el-table-column>
            </el-table>
            <div class="pager"><el-pagination layout="prev, pager, next, total" :total="uTotal" :page-size="20"
              :current-page="uPage" @current-change="p => { uPage = p; loadUsers(); }"/></div>
          </el-card>
        </div>

        <!-- ======== 公告管理 ======== -->
        <div v-if="view==='announcements'" class="page">
          <el-card shadow="never">
            <template #header>
              <el-button type="primary" @click="annDialog = true">发布公告</el-button>
            </template>
            <el-table :data="announcements" stripe>
              <el-table-column prop="id" label="ID" width="60"/>
              <el-table-column prop="title" label="标题" show-overflow-tooltip/>
              <el-table-column prop="status" label="状态" width="90"/>
              <el-table-column prop="publishAt" label="发布时间" width="170"/>
              <el-table-column label="操作" width="150" fixed="right">
                <template #default="s">
                  <el-button size="small" @click="editAnn(s.row)">编辑</el-button>
                  <el-button size="small" type="danger" @click="deleteAnn(s.row.id)">删除</el-button>
                </template>
              </el-table-column>
            </el-table>
          </el-card>
          <el-dialog v-model="annDialog" :title="annForm.id ? '编辑公告' : '发布公告'" width="520px">
            <el-form label-width="60px">
              <el-form-item label="标题"><el-input v-model="annForm.title"/></el-form-item>
              <el-form-item label="内容"><el-input v-model="annForm.content" type="textarea" :rows="4"/></el-form-item>
            </el-form>
            <template #footer>
              <el-button @click="annDialog=false">取消</el-button>
              <el-button type="primary" @click="saveAnn">保存</el-button>
            </template>
          </el-dialog>
        </div>

        <!-- ======== 基础数据 ======== -->
        <div v-if="view==='data'" class="page">
          <el-row :gutter="14">
            <el-col :span="12">
              <el-card shadow="never">
                <template #header><div style="display:flex;justify-content:space-between;align-items:center">
                  <span>考试类别</span>
                  <el-button size="small" type="primary" @click="promptNewExam">新增</el-button>
                </div></template>
                <el-table :data="exams" size="small">
                  <el-table-column prop="id" label="ID" width="50"/>
                  <el-table-column prop="name" label="名称"/>
                  <el-table-column prop="code" label="代码" width="80"/>
                  <el-table-column label="操作" width="70">
                    <template #default="s"><el-button size="small" text type="primary" @click="promptEditExam(s.row)">改</el-button></template>
                  </el-table-column>
                </el-table>
              </el-card>
            </el-col>
            <el-col :span="12">
              <el-card shadow="never">
                <template #header><div style="display:flex;justify-content:space-between;align-items:center">
                  <span>科目</span>
                  <el-button size="small" type="primary" @click="promptNewSubject">新增</el-button>
                </div></template>
                <el-table :data="subjectAdmin" size="small">
                  <el-table-column prop="id" label="ID" width="50"/>
                  <el-table-column prop="name" label="名称"/>
                  <el-table-column prop="examCategoryId" label="类别" width="60"/>
                  <el-table-column label="操作" width="70">
                    <template #default="s"><el-button size="small" text type="primary" @click="promptEditSubject(s.row)">改</el-button></template>
                  </el-table-column>
                </el-table>
              </el-card>
            </el-col>
          </el-row>
        </div>

        <!-- ======== 操作日志 ======== -->
        <div v-if="view==='logs'" class="page">
          <el-card shadow="never">
            <el-table :data="logs" stripe size="small">
              <el-table-column prop="id" label="ID" width="60"/>
              <el-table-column prop="username" label="操作人" width="100"/>
              <el-table-column prop="module" label="模块" width="90"/>
              <el-table-column prop="action" label="动作" width="90"/>
              <el-table-column prop="targetType" label="对象" width="100"/>
              <el-table-column prop="targetId" label="对象ID" width="80"/>
              <el-table-column label="详情" show-overflow-tooltip><template #default="s">{{ s.row.detail }}</template></el-table-column>
              <el-table-column prop="ip" label="IP" width="120"/>
              <el-table-column prop="createdAt" label="时间" width="170"/>
            </el-table>
            <div class="pager"><el-pagination layout="prev, pager, next, total" :total="logTotal" :page-size="20"
              :current-page="logPage" @current-change="p => { logPage = p; loadLogs(); }"/></div>
          </el-card>
        </div>
      </el-main>
    </el-container>
  </el-container>
</div>

<script>
const { createApp } = Vue;
const API = '/api';

async function api(method, path, body) {
  const token = localStorage.getItem('token') || '';
  const resp = await fetch(API + path, {
    method,
    headers: Object.assign({'Content-Type': 'application/json'},
      token ? {Authorization: 'Bearer ' + token} : {}),
    body: body === undefined ? undefined : JSON.stringify(body)
  });
  if (resp.status === 401) {
    localStorage.removeItem('token');
    location.reload();
    throw new Error('登录已过期');
  }
  const json = await resp.json();
  if (json.code !== 200) throw new Error(json.message || '请求失败');
  return json.data;
}

createApp({
  data() {
    return {
      token: localStorage.getItem('token') || '',
      whoami: localStorage.getItem('whoami') || '',
      logging: false,
      loginForm: {studentNo: '', password: ''},
      view: 'dashboard',

      dashboard: {}, resourceTypes: {}, roleStats: {},
      questionTypes: [],

      questions: [], qTotal: 0, qFilter: {page: 1, type: null, keyword: null},
      resources: [], rTotal: 0, rFilter: {page: 1, audited: false},
      reports: [], repTotal: 0, repFilter: {page: 1, status: 'PENDING'},
      appeals: [], appTotal: 0, appFilter: {page: 1, status: 'PENDING'},
      users: [], uTotal: 0, uPage: 1,
      announcements: [], annDialog: false,
      annForm: {id: null, title: '', content: ''},
      exams: [], subjectAdmin: [],
      logs: [], logTotal: 0, logPage: 1
    };
  },
  methods: {
    statusTag(s) {
      return {PENDING: 'warning', APPROVED: 'success', REJECTED: 'danger', OFFLINE: 'info', APPEALING: 'warning'}[s] || 'info';
    },
    dashLabel(k) {
      return {userCount: '用户数', questionCount: '题目数', resourceCount: '资料数',
        pendingResourceCount: '待审资料', pendingQuestionCount: '待审题目',
        pendingReportCount: '待处理举报', downloadCount: '下载量', todayResourceCount: '今日新增资料'}[k] || k;
    },
    async login() {
      if (!this.loginForm.studentNo || !this.loginForm.password) {
        ElementPlus.ElMessage.warning('请输入账号和密码');
        return;
      }
      this.logging = true;
      try {
        const resp = await fetch(API + '/auth/login', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(this.loginForm)
        });
        const json = await resp.json();
        if (json.code !== 200) throw new Error(json.message);
        if (!['AUDITOR', 'ADMIN'].includes(json.data.user.role)) {
          throw new Error('该账号无管理端权限（需 AUDITOR / ADMIN）');
        }
        this.token = json.data.token;
        localStorage.setItem('token', this.token);
        this.whoami = json.data.user.nickname + '（' + json.data.user.role + '）';
        localStorage.setItem('whoami', this.whoami);
        ElementPlus.ElMessage.success('登录成功');
        this.loadView();
      } catch (e) {
        ElementPlus.ElMessage.error(e.message);
      } finally {
        this.logging = false;
      }
    },
    logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('whoami');
      this.token = '';
    },
    loadView() {
      const map = {
        dashboard: 'loadDashboard', questions: 'loadQuestions', resources: 'loadResources',
        reports: 'loadReports', appeals: 'loadAppeals', users: 'loadUsers',
        announcements: 'loadAnnouncements', data: 'loadData', logs: 'loadLogs'
      };
      if (map[this.view]) this[map[this.view]]();
    },

    async loadDashboard() {
      this.dashboard = await api('GET', '/admin/dashboard');
      this.resourceTypes = await api('GET', '/admin/stats/resource-types');
      this.roleStats = await api('GET', '/admin/stats/roles');
    },
    async loadQuestions() {
      const f = this.qFilter;
      const data = await api('GET', '/admin/audits/questions?page=' + f.page +
        '&size=20' + (f.type ? '&type=' + f.type : '') + (f.keyword ? '&keyword=' + encodeURIComponent(f.keyword) : ''));
      this.questions = data.list || [];
      this.qTotal = data.total;
      if (!this.questionTypes.length) {
        this.questionTypes = await api('GET', '/questions/types');
      }
    },
    async auditQuestion(id, action) {
      let body = {};
      if (action === 'reject' || action === 'offline') {
        const r = await ElementPlus.ElMessageBox.prompt('请输入' + (action === 'reject' ? '驳回' : '下架') + '原因', '审核');
        body = {reason: r.value};
      }
      await api('POST', '/admin/audits/questions/' + id + '/' + action, body);
      ElementPlus.ElMessage.success('已' + {approve: '通过', reject: '驳回', offline: '下架'}[action]);
      this.loadQuestions();
    },
    async loadResources() {
      const f = this.rFilter;
      const data = await api('GET', '/admin/audits/resources' + (f.audited ? '/audited' : '') +
        '?page=' + f.page + '&size=20');
      this.resources = data.list || [];
      this.rTotal = data.total;
    },
    async auditResource(id, action) {
      let body = {};
      if (action !== 'approve') {
        const r = await ElementPlus.ElMessageBox.prompt('请输入原因', '审核');
        body = {reason: r.value};
      }
      await api('POST', '/admin/audits/resources/' + id + '/' + action, body);
      ElementPlus.ElMessage.success('操作成功');
      this.loadResources();
    },
    async loadReports() {
      const f = this.repFilter;
      const data = await api('GET', '/admin/reports?page=' + f.page + '&size=20' +
        (f.status ? '&status=' + f.status : ''));
      this.reports = data.list || [];
      this.repTotal = data.total;
    },
    async handleReport(id, status, offline) {
      const r = await ElementPlus.ElMessageBox.prompt('处理说明（可空）', '举报处理');
      await api('POST', '/admin/reports/' + id + '/handle',
        {status, note: r.value || '', offlineTarget: offline});
      ElementPlus.ElMessage.success('已处理');
      this.loadReports();
    },
    async loadAppeals() {
      const f = this.appFilter;
      const data = await api('GET', '/admin/appeals?page=' + f.page + '&size=20' +
        (f.status ? '&status=' + f.status : ''));
      this.appeals = data.list || [];
      this.appTotal = data.total;
    },
    async handleAppeal(id, action) {
      const r = await ElementPlus.ElMessageBox.prompt('处理说明（可空）', '申诉处理');
      await api('POST', '/admin/appeals/' + id + '/' + action, {reason: r.value || ''});
      ElementPlus.ElMessage.success('已处理');
      this.loadAppeals();
    },
    async loadUsers() {
      const data = await api('GET', '/admin/users?page=' + this.uPage + '&size=20');
      this.users = data.list || [];
      this.uTotal = data.total;
    },
    async changeRole(user, role) {
      await api('PUT', '/admin/users/' + user.id + '/role', {role});
      ElementPlus.ElMessage.success('角色已调整');
      this.loadUsers();
    },
    async changeStatus(user) {
      await api('PUT', '/admin/users/' + user.id + '/status', {status: user.status === 1 ? 0 : 1});
      ElementPlus.ElMessage.success('状态已调整');
      this.loadUsers();
    },
    async loadAnnouncements() {
      this.announcements = await api('GET', '/admin/announcements');
    },
    editAnn(row) {
      this.annForm = {id: row.id, title: row.title, content: row.content};
      this.annDialog = true;
    },
    async saveAnn() {
      if (!this.annForm.title || !this.annForm.content) {
        ElementPlus.ElMessage.warning('标题和内容必填');
        return;
      }
      if (this.annForm.id) {
        await api('PUT', '/admin/announcements/' + this.annForm.id, this.annForm);
      } else {
        await api('POST', '/admin/announcements', this.annForm);
      }
      ElementPlus.ElMessage.success('已保存');
      this.annDialog = false;
      this.loadAnnouncements();
    },
    async deleteAnn(id) {
      await ElementPlus.ElMessageBox.confirm('确定删除该公告？', '删除');
      await api('DELETE', '/admin/announcements/' + id);
      ElementPlus.ElMessage.success('已删除');
      this.loadAnnouncements();
    },
    async loadData() {
      this.exams = await api('GET', '/admin/data/exams');
      this.subjectAdmin = await api('GET', '/admin/data/subjects');
    },
    async promptNewExam() {
      const r = await ElementPlus.ElMessageBox.prompt('考试类别名称', '新增考试类别');
      await api('POST', '/admin/data/exams', {name: r.value, code: 'EXAM' + Date.now() % 10000, type: 'NATIONAL', sort: 99});
      this.loadData();
    },
    async promptEditExam(row) {
      const r = await ElementPlus.ElMessageBox.prompt('考试类别名称', '编辑', {inputValue: row.name});
      await api('PUT', '/admin/data/exams/' + row.id, Object.assign({}, row, {name: r.value}));
      this.loadData();
    },
    async promptNewSubject() {
      const r = await ElementPlus.ElMessageBox.prompt('科目名称', '新增科目');
      await api('POST', '/admin/data/subjects', {name: r.value, examCategoryId: 1, sort: 99});
      this.loadData();
    },
    async promptEditSubject(row) {
      const r = await ElementPlus.ElMessageBox.prompt('科目名称', '编辑', {inputValue: row.name});
      await api('PUT', '/admin/data/subjects/' + row.id, Object.assign({}, row, {name: r.value}));
      this.loadData();
    },
    async loadLogs() {
      const data = await api('GET', '/admin/logs?page=' + this.logPage + '&size=20');
      this.logs = data.list || [];
      this.logTotal = data.total;
    }
  },
  mounted() {
    if (this.token) this.loadView();
  }
}).use(ElementPlus).mount('#app');
</script>
</body>
</html>
