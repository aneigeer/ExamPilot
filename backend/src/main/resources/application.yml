server:
  port: 8080
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: exam-prep-backend

  # 本地敏感配置（数据库口令等）放 application-local.yml
  # 该文件已被 .gitignore 排除，不会进 Git
  # 参考模板见 application-local.yml.example
  profiles:
    active: local

  # ========== 数据源 ==========
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/exam_prep?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&rewriteBatchedStatements=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ========== JSON 序列化 ==========
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  # ========== 文件上传 ==========
  servlet:
    multipart:
      enabled: true
      max-file-size: 200MB
      max-request-size: 210MB

# ========== MyBatis-Plus ==========
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.examprep.**.entity

# ========== 接口文档（Swagger UI）==========
# 访问地址：http://localhost:8080/api/swagger-ui.html
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
  default-produces-media-type: application/json

# ========== 业务自定义配置 ==========
app:
  jwt:
    # 安全要求：默认值必须为空，强制从环境变量 JWT_SECRET 或 application-local.yml 注入，
    # 防止把固定密钥提交进 Git 被伪造 token。为空时应用启动即失败（见 JwtUtil 构造器校验）。
    secret: ${JWT_SECRET:}
    # 令牌有效期（分钟），默认 7 天
    expire-minutes: 10080
    header: Authorization
    prefix: "Bearer "
  upload:
    # 文件存储目录（相对项目根目录）
    dir: ./uploads
    image-max-size: 10485760
    allowed-image-types: jpg,jpeg,png,webp,gif
  preview:
    # 游客可预览页数
    guest-pages: 3

  # ========== AI 导学（RAG 检索增强 + 抽取式兜底 + 学情画像）==========
  # 全部参数化，使用时可现场改一个数看效果。
  # 密钥类配置默认值留空（对齐 app.jwt.secret 的安全规范），空值不报错、走降级链路。
  ai:
    llm:
      # 客户端标识：dashscope（阿里云百炼）/ zhipu（智谱 GLM）/ extractive（强制本地抽取）
      provider: extractive
      # API Key：留空即自动走抽取式兜底，接口仍返回 200。
      # 生产环境用环境变量注入：LLM_API_KEY
      api-key: ${LLM_API_KEY:}
      # 单次调用超时（毫秒），超时计入熔断计数
      timeout-millis: 8000
      # 连续失败多少次后熔断
      circuit-breaker-threshold: 3
      # 熔断持续时间（毫秒），期间静默降级为抽取式，用户无感
      circuit-breaker-open-millis: 60000
      dashscope-model: qwen-plus
      zhipu-model: glm-4-flash
    retrieval:
      # 召回条数（重排前的候选池）
      recall-limit: 50
      # 最终进入生成环节的块数 K
      top-k: 5
      # ★ 拒答阈值：最高分低于此值直接拒答，不进生成环节（反幻觉第一道闸门）
      reject-threshold: 0.15
      # 查询串最大长度，超出截断，防止超长查询拖垮索引
      max-query-length: 100
      # term 最小长度，低于此值丢弃（ngram_token_size 默认 2，单字成不了词）
      min-term-length: 2
      # ★ 词项覆盖率下限（**仅 ngram 字面通道用**）：bigram OR 语义的精度补偿
      # 实测标定：无关问题「量子力学波函数如何求解」覆盖率 0.09 → 剔除；
      #          相关问题「值传递和地址传递有什么区别」覆盖率 0.42 → 保留
      min-term-coverage: 0.25

      # ★ 向量相似度下限（**仅向量通道用**，Qdrant 余弦相似度）
      #
      # ★ 为什么两路必须用不同的闸门（实测踩出来的）：
      #   「函数传参有哪些方式」→ ngram 覆盖率仅 0.125（字面确实该剔），
      #                          但向量 score 0.5884（语义上就是同一件事，必须放行）。
      #   共用一道闸门会把向量唯一的优势一起吞掉。
      #
      # 标定依据（Java+Python+Qdrant+bge 全链路在线，逐条 curl /v1/search 实测）：
      #   相关：0.7235 / 0.6328 / 0.5884 / 0.5802
      #   无关：0.5126 / 0.5079 / 0.4781 / 0.4737 / 0.4184
      #   → 无关最高 0.5126，相关最低有效 0.5802，取 0.55
      # ⚠️ 不能只拿「量子纠缠」（最高仅 0.4184）标定，会得到 0.45 而漏放
      #    「量子力学波函数如何求解」（0.5126）
      # ⚠️ 语料扩充后必须重新标定：当前仅 42 chunk，余弦分压在 0.47~0.72 窄带，余量仅 ~0.03
      min-vector-score: 0.55

      # ★ 向量相似度「相对阈值」系数：最终闸门 = max(min-vector-score, ratio × 本次最高分)
      # 语义：不够像本次最高分的那条，差太远的一律不要。
      # 作用：余弦分布会随语料规模整体漂移（语料从 42 块扩到几千块后同主题分普遍抬高），
      #      纯绝对阈值会失效；相对量让闸门自适应语料规模，扩充语料后无需重新调参。
      # 0.8 = 低于本次最高分 80% 的候选一律剔除（语料少时由绝对阈值 0.55 兜底）
      vector-score-ratio: 0.8
      # ---- 五因子重排权重（finalScore = Σ 因子 × 权重）----
      fulltext-weight: 1.0
      title-weight: 0.30
      knowledge-weight: 0.25
      fresh-weight: 0.15
      hot-weight: 0.10
      # 时间衰减底数：fresh = decay-base ^ ageDays
      decay-base: 0.85
    profile:
      # 时间衰减半衰期（天）：30 天前的作答权重减半
      half-life-days: 30
      # 难度权重：w = base + step × difficulty（difficulty=1:0.7 / 3:0.9 / 5:1.1）
      difficulty-weight-base: 0.6
      difficulty-weight-step: 0.1
      # 错题本加权：wrongBoost = 1 + factor × MIN(wrong_count, cap)
      wrong-boost-factor: 0.5
      wrong-boost-cap: 3
      # 置信度饱和所需作答数：confidence = MIN(1, attempts / threshold)
      # ★ 这是「只做 1 题就判薄弱」防护的关键参数
      confidence-threshold: 3
      # 检索时薄弱知识点加权（对应设计文档 A.7 ③）
      weak-kp-search-boost: 0.15
      # 冷启动判定：有效作答少于该值时走热门兜底推荐
      cold-start-attempts: 3
    prompt:
      # 温度越小越稳，越不容易发散
      temperature: 0.2
      max-tokens: 800
    knowledge:
      # PDF 切块：单块 400 字、相邻块重叠 80 字（避免答案被切断）
      chunk-size: 400
      overlap: 80
      # 单来源最大块数（防超大 PDF 拖垮索引）
      max-chunks-per-source: 200
      # 抽取式兜底：句子 term 覆盖率阈值 + 最多保留句数
      extractive-coverage-threshold: 0.3
      extractive-max-sentences: 5
      # 知识点块最多引用几条题目摘要
      knowledge-snippet-count: 3
      # 用户问题最大长度
      max-question-length: 200

    # ========== T09：FastAPI AI 微服务（向量检索通道）==========
    # ★ 安全底线：enabled=false 或服务不可用时，向量通道静默跳过，
    #   问答自动退化为 ngram 字面检索 + 抽取式生成，接口仍返回 200。
    fastapi:
      enabled: false
      base-url: ${AI_SERVICE_URL:http://127.0.0.1:8000}
      # Python 侧路由挂在 /v1 下（见 ai-service/app/routers/search.py）
      path-prefix: /v1
      # 超时预算（设计文档 A.1）：检索 1200ms / 健康 1000ms / 索引推送 5000ms
      search-timeout-millis: 1200
      health-timeout-millis: 1000
      index-timeout-millis: 5000
      # 熔断：连续失败 3 次 → 熔断 60s，期间静默降级
      circuit-breaker-threshold: 3
      circuit-breaker-open-millis: 60000
      # 健康检查缓存有效期（避免每次问答都打一次 health）
      health-cache-millis: 10000

    # ========== T09：向量检索 ==========
    # 与 ngram 通道「并存融合」而非替换：向量管语义召回，ngram 管字面精确。
    vector:
      enabled: false
      # 向量召回条数（与 ngram 的 recall-limit 同量级，便于公平融合）
      recall-limit: 20
      # 双通道加成：同一 chunk 被两路都命中时的分数加成（混合检索的关键）
      dual-hit-boost: 0.25
      # Qdrant 余弦相似度范围，用于归一化到 [0,1]
      # ★ 向量分与 ngram 的 ft_score 不同量纲，必须先归一化再相加
      score-floor: -1.0
      score-ceiling: 1.0
      # 向量分在融合总权重中的占比（其余给 ngram 分），两者归一化后线性混合
      score-weight: 0.5

    # ========== T10：对象存储（MinIO 双轨）==========
    # ★ 铁律：上传永远不能失败。MinIO 不可用 → 自动落本地磁盘。
    # enabled=false 时行为与现在完全一致（纯本地）。
    storage:
      enabled: false
      provider: local
      endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
      access-key: ${MINIO_ACCESS_KEY:}
      secret-key: ${MINIO_SECRET_KEY:}
      bucket: exam-prep
      auto-create-bucket: true
      timeout-millis: 3000
      circuit-breaker-threshold: 3
      circuit-breaker-open-millis: 60000
      # 双写：迁移期同时写本地（安全但冗余，使用一段时间后可关）
      dual-write-local: true

logging:
  level:
    root: info
    com.examprep: debug
    org.springframework.security: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
