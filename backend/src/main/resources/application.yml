server:
  port: 8080
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: exam-prep-backend

  # 本地敏感配置（数据库口令等）放 application-local.yml
  # 该文件已被 .gitignore 排除，不会进 Git
  # 参考模板见 application-local.yml.example
  profiles:
    active: local

  # ========== 数据源 ==========
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/exam_prep?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&rewriteBatchedStatements=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ========== Redis（异步任务队列，可选） ==========
  # 未启动 Redis 时应用仍可正常启动；任务接口返回 503，其余功能不受影响。
  # Redis 健康检查已关闭，避免 Redis 缺席时 /actuator/health 整体 DOWN。
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      timeout: 1s
      connect-timeout: 1s
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 0

  # ========== JSON 序列化 ==========
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  # ========== 文件上传 ==========
  servlet:
    multipart:
      enabled: true
      max-file-size: 200MB
      max-request-size: 210MB

# ========== MyBatis-Plus ==========
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.examprep.**.entity

# ========== 接口文档（Swagger UI）==========
# 访问地址：http://localhost:8080/api/swagger-ui.html
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
  default-produces-media-type: application/json

# ========== 业务自定义配置 ==========
app:
  jwt:
    # 安全要求：默认值必须为空，强制从环境变量 JWT_SECRET 或 application-local.yml 注入，
    # 防止把固定密钥提交进 Git 被伪造 token。为空时应用启动即失败（见 JwtUtil 构造器校验）。
    secret: ${JWT_SECRET:}
    # 令牌有效期（分钟），默认 7 天
    expire-minutes: 10080
    header: Authorization
    prefix: "Bearer "
  upload:
    # 文件存储目录（相对项目根目录）
    dir: ./uploads
    image-max-size: 10485760
    allowed-image-types: jpg,jpeg,png,webp,gif
  preview:
    # 游客可预览页数
    guest-pages: 3

  cors:
    # 允许跨域的来源（逗号分隔）。管理端与后端同源部署时仅需本机；
    # 部署到正式域名后务必覆盖，否则从其它源发起的浏览器请求会被拦。
    # 覆盖方式：环境变量 APP_CORS_ALLOWED_ORIGINS=https://api.example.com,https://admin.example.com
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:8080}

  resource:
    # 推荐排序热度分（物化列 resource.hot_score）的定时重算
    # 需先执行 sql/migration-perf.sql 建列与组合索引；未执行时任务只告警，不影响主业务
    hot-score:
      initial-delay-millis: 60000      # 启动后 1 分钟首次重算
      refresh-millis: 3600000          # 之后每小时重算一次

  # ========== AI 导学（RAG 检索增强 + 抽取式兜底 + 学情画像）==========
  # 全部参数化，使用时可现场改一个数看效果。
  # 密钥类配置默认值留空（对齐 app.jwt.secret 的安全规范），空值不报错、走降级链路。
  ai:
    # ========== Agent 内部接口令牌（Java ↔ Python）==========
    # 为空时 /internal/** 一律 403（安全默认值）；启用 Agent 时必须配置。
    # 生产用环境变量注入：AI_INTERNAL_TOKEN
    internal-token: ${AI_INTERNAL_TOKEN:}

    # ========== Agent Harness ==========
    agent:
      # false 时 /ai/agent/** 返回 503，原有 /ai/ask 完全不受影响
      enabled: ${AI_AGENT_ENABLED:false}
      max-steps: 6
      max-tool-calls: 4
      # prompt 字符预算（≈8k tokens），超出后从最老的工具结果开始截断
      max-prompt-chars: 8000
      # 全局并发上限（进程内信号量，单实例部署前提）
      max-concurrent: 8
      stream-timeout-millis: 120000

    # ========== 异步任务队列（Redis Stream） ==========
    jobs:
      enabled: ${AI_JOBS_ENABLED:false}
      stream: exam:jobs
      eval-stream: exam:eval
      # Wiki 蒸馏是分钟级 LLM 长任务，独立 stream + 独立 worker，避免挤占业务任务
      wiki-stream: exam:wiki
      group: expert-workers

    llm:
      # 客户端标识：ollama（本地模型）/ dashscope（阿里云百炼）/ zhipu（智谱 GLM）/ extractive（强制本地抽取）
      # ⚠️ 注意：provider 只影响日志与展示，**实际选路由 @Order + available() 决定**
      #    （见 AiQaService.isProviderCandidate：只排除 Extractive，不按 provider 过滤）
      provider: ollama

      # ---------- 本地模型 Ollama（推荐，无需 Key、不过期、零费用）----------
      # OpenAI 兼容端点，注意带 /v1，程序内部会拼 /chat/completions
      ollama-base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434/v1}
      # 用 `ollama create` 定义的名字（如 qwen2.5-7b）
      ollama-model: ${OLLAMA_MODEL:qwen2.5-7b}
      # ★ 7B 模型生成 300 token 需 15–25 秒，必须给足；云端仍用下面的 timeout-millis(8s)
      #   绝不要为了本地模型把全局超时改成 90s —— 云端失败时会白等 90 秒才降级
      ollama-timeout-millis: ${OLLAMA_TIMEOUT_MS:90000}

      # API Key：留空即自动走抽取式兜底，接口仍返回 200。
      # 生产环境用环境变量注入：LLM_API_KEY
      api-key: ${LLM_API_KEY:}
      # 单次调用超时（毫秒），超时计入熔断计数
      timeout-millis: 8000
      # 连续失败多少次后熔断
      circuit-breaker-threshold: 3
      # 熔断持续时间（毫秒），期间静默降级为抽取式，用户无感
      circuit-breaker-open-millis: 60000
      dashscope-model: qwen-plus
      zhipu-model: glm-4-flash
    retrieval:
      # 召回条数（重排前的候选池）
      recall-limit: 50
      # 最终进入生成环节的块数 K
      top-k: 5
      # ★ 拒答阈值：最高分低于此值直接拒答，不进生成环节（反幻觉第一道闸门）
      reject-threshold: 0.15
      # 查询串最大长度，超出截断，防止超长查询拖垮索引
      max-query-length: 100
      # term 最小长度，低于此值丢弃（ngram_token_size 默认 2，单字成不了词）
      min-term-length: 2
      # ★ 词项覆盖率下限（**仅 ngram 字面通道用**）：bigram OR 语义的精度补偿
      # 该阈值与语料规模无关（命中 bigram / 查询 bigram），因此语料扩到 3000+ 条后
      # 只需重标定它，而不必动依赖分数的 reject-threshold。
      # 语料 59 → 3092 块后实测标定（同一次评测集）：
      #   0.25 → 拒答 4/10、Recall@5 91.7%（闸门形同虚设）
      #   0.40 → 拒答 7/10、Recall@5 91.7%
      #   0.50 → 拒答 9/10、Recall@5 91.7%（取此值：两端都守住）
      #   0.60 → 拒答 10/10、Recall@5 66.7%（过严，把相关问题一起拒了）
      min-term-coverage: 0.5

      # ★ 向量相似度下限（**仅向量通道用**，Qdrant 余弦相似度）
      #
      # ★ 为什么两路必须用不同的闸门（实测踩出来的）：
      #   「函数传参有哪些方式」→ ngram 覆盖率仅 0.125（字面确实该剔），
      #                          但向量 score 0.5884（语义上就是同一件事，必须放行）。
      #   共用一道闸门会把向量唯一的优势一起吞掉。
      #
      # 标定依据（Java+Python+Qdrant+bge 全链路在线，逐条 curl /v1/search 实测）：
      #   相关：0.7235 / 0.6328 / 0.5884 / 0.5802
      #   无关：0.5126 / 0.5079 / 0.4781 / 0.4737 / 0.4184
      #   → 无关最高 0.5126，相关最低有效 0.5802，取 0.55
      # ⚠️ 不能只拿「量子纠缠」（最高仅 0.4184）标定，会得到 0.45 而漏放
      #    「量子力学波函数如何求解」（0.5126）
      # ⚠️ 语料扩充后必须重新标定：当前仅 42 chunk，余弦分压在 0.47~0.72 窄带，余量仅 ~0.03
      min-vector-score: 0.55

      # ★ 向量相似度「相对阈值」系数：最终闸门 = max(min-vector-score, ratio × 本次最高分)
      # 语义：不够像本次最高分的那条，差太远的一律不要。
      # 作用：余弦分布会随语料规模整体漂移（语料从 42 块扩到几千块后同主题分普遍抬高），
      #      纯绝对阈值会失效；相对量让闸门自适应语料规模，扩充语料后无需重新调参。
      # 0.8 = 低于本次最高分 80% 的候选一律剔除（语料少时由绝对阈值 0.55 兜底）
      vector-score-ratio: 0.8

      # ★ 内容词覆盖度下限（**拒答用，只算实词**：疑问壳与虚词 bigram 已被剔除）
      # 衡量「用户问的实体在最佳块里出现了多少」，拦「只共享一个通用词」的命中。
      # 0.45 标定（语料 11300 块，RetrievalServiceTest 诊断表）：
      #   域内 12 条覆盖度最低 0.50；域外 0.20 / 0.33 被拦，0.71/0.75/1.00 靠语义闸门拦。
      # 取值落在 0.33 与 0.50 之间，给域内最低值留 0.05 余量。
      # ★ 代码默认值必须与本值一致（见 AiConfigConsistencyTest 护栏）。
      min-content-coverage: 0.45

      # ★ 语义拒答线（top1 余弦）：**向量通道就绪时才生效**，且只在「字面通道也没证据」时否决
      # 它是当前拒答能力的唯一语义防线——「区块链智能合约怎么写」这类
      # 「实体在语料里存在、但没有一段文字在回答它」的问题，只有它拦得住。
      # 标定（语料 11300 块，逐条 /v1/search 实测）：
      #   域内 12 条 top1 余弦最低 0.6328（函数传参），域外 10 条最高 0.6115
      #   → 取 0.62，域内余量 0.013（偏薄）
      # ⚠️ 语料扩容（11300 → 11999 → 12900）后**必须重新标定**：余弦分布随语料整体漂移，
      #    调参时只改这里即可，无需改代码；若域内最低值跌破本阈值，说明该重标而非放宽。
      # ★ 代码默认值必须与本值一致（见 AiConfigConsistencyTest 护栏）。
      semantic-reject-score: 0.62
      # ---- 五因子重排权重（finalScore = Σ 因子 × 权重）----
      fulltext-weight: 1.0
      title-weight: 0.30
      knowledge-weight: 0.25
      fresh-weight: 0.15
      hot-weight: 0.10
      # 时间衰减底数：fresh = decay-base ^ ageDays
      decay-base: 0.85
    profile:
      # 时间衰减半衰期（天）：30 天前的作答权重减半
      half-life-days: 30
      # 难度权重：w = base + step × difficulty（difficulty=1:0.7 / 3:0.9 / 5:1.1）
      difficulty-weight-base: 0.6
      difficulty-weight-step: 0.1
      # 错题本加权：wrongBoost = 1 + factor × MIN(wrong_count, cap)
      wrong-boost-factor: 0.5
      wrong-boost-cap: 3
      # 置信度饱和所需作答数：confidence = MIN(1, attempts / threshold)
      # ★ 这是「只做 1 题就判薄弱」防护的关键参数
      confidence-threshold: 3
      # 检索时薄弱知识点加权（对应设计文档 A.7 ③）
      weak-kp-search-boost: 0.15
      # 冷启动判定：有效作答少于该值时走热门兜底推荐
      cold-start-attempts: 3
    prompt:
      # 温度越小越稳，越不容易发散
      temperature: 0.2
      max-tokens: 800
    knowledge:
      # PDF 切块：单块 400 字、相邻块重叠 80 字（避免答案被切断）
      chunk-size: 400
      overlap: 80
      # 单来源最大块数（防超大 PDF 拖垮索引）
      max-chunks-per-source: 200
      # 抽取式兜底：句子 term 覆盖率阈值 + 最多保留句数
      extractive-coverage-threshold: 0.3
      extractive-max-sentences: 5
      # 知识点块最多引用几条题目摘要
      knowledge-snippet-count: 3
      # 用户问题最大长度
      max-question-length: 200

    # ========== T09：FastAPI AI 微服务（向量检索通道）==========
    # ★ 安全底线：enabled=false 或服务不可用时，向量通道静默跳过，
    #   问答自动退化为 ngram 字面检索 + 抽取式生成，接口仍返回 200。
    fastapi:
      enabled: false
      base-url: ${AI_SERVICE_URL:http://127.0.0.1:8000}
      # Python 侧路由挂在 /v1 下（见 ai-service/app/routers/search.py）
      path-prefix: /v1
      # 超时预算（设计文档 A.1）：检索 1200ms / 健康 1000ms
      search-timeout-millis: 1200
      health-timeout-millis: 1000
      # 索引推送：单次最多 500 条，CPU 端 bge-small 嵌入实测约 12s/500 条，
      # 原设计预算 5000ms 会误判为超时（推送已成功但 Java 侧读不到响应）。
      # 故放宽到 60s；若本机嵌入更快可下调回。
      index-timeout-millis: 60000
      # 熔断：连续失败 3 次 → 熔断 60s，期间静默降级
      circuit-breaker-threshold: 3
      circuit-breaker-open-millis: 60000
      # 健康检查缓存有效期（避免每次问答都打一次 health）
      health-cache-millis: 10000

    # ========== T09：向量检索 ==========
    # 与 ngram 通道「并存融合」而非替换：向量管语义召回，ngram 管字面精确。
    vector:
      enabled: false
      # 向量召回条数（与 ngram 的 recall-limit 同量级，便于公平融合）
      recall-limit: 20
      # 双通道加成：同一 chunk 被两路都命中时的分数加成（混合检索的关键）
      dual-hit-boost: 0.25
      # Qdrant 余弦相似度范围，用于归一化到 [0,1]
      # ★ 向量分与 ngram 的 ft_score 不同量纲，必须先归一化再相加
      score-floor: -1.0
      score-ceiling: 1.0
      # 向量分在融合总权重中的占比（其余给 ngram 分），两者归一化后线性混合
      score-weight: 0.5

    # ========== A1：语义路由（/v1/route）==========
    # 路由负责回答两个问题：这题该用哪个 skill、该只检索哪几类来源。
    # ★ 默认关闭：关闭时直接返回默认路由（COURSE_QA + 不过滤），不发起任何 HTTP 调用，
    #   行为与未引入路由时完全一致 → 灰度/回退都只是改这一个开关。
    # ★ 失败绝不拒答：Python 不可达/超时/5xx 一律降级为默认 skill 继续检索
    #   （见 AiRouteClient 的 fallback 路径），用户不该为「路由挂了」而拿不到答案。
    route:
      enabled: false
      # 读超时：本地 bge 路由 P95 约 20ms，300ms 是 15 倍余量；
      # 路由是问答链路上最不该拖慢体感的环节，宁可降级也不让用户等
      timeout-millis: 300
      # 连接超时（与读超时分开）：回环建连通常 <5ms，500ms 覆盖服务刚重启的窗口
      connect-timeout-millis: 500
      # 太短的问题（「你好」「在吗」）路由信息量不足，直接走默认，不付一次往返
      min-question-length: 6
      # 结果缓存：同一问题重复提问（用户重试/多人问相似题）不重复打路由
      cache-max-entries: 200
      cache-ttl-millis: 600000

    # ========== T10：对象存储（MinIO 双轨）==========
    # ★ 铁律：上传永远不能失败。MinIO 不可用 → 自动落本地磁盘。
    # enabled=false 时行为与现在完全一致（纯本地）。
    storage:
      enabled: false
      provider: local
      endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
      access-key: ${MINIO_ACCESS_KEY:}
      secret-key: ${MINIO_SECRET_KEY:}
      bucket: exam-prep
      auto-create-bucket: true
      timeout-millis: 3000
      circuit-breaker-threshold: 3
      circuit-breaker-open-millis: 60000
      # 双写：迁移期同时写本地（安全但冗余，使用一段时间后可关）
      dual-write-local: true

  # ========== LLM Wiki 双引擎 ==========
  # 设计：RAG 即时可用（文档入库即可检索），Wiki 异步沉淀（每日蒸馏 → 人工审核 → 发布）。
  # 问答顺序：Wiki 热层优先 → 未命中降级 RAG 冷层 → 长尾问题仍由 RAG 兜底。
  # 关闭 enabled 后行为与未引入 Wiki 时完全一致。
  wiki:
    enabled: ${AI_WIKI_ENABLED:true}
    # 热层命中阈值（页面摘要向量余弦相似度）
    hit-threshold: 0.55
    # 向量召回候选数
    vector-limit: 10
    # ngram 字面通道最低原始相关度 + 归一化尺度（ft_score 非 0-1）
    ngram-min-score: 8.0
    ngram-score-scale: 20.0
    # ★ 小语料下 MATCH 的 IDF 接近 0，字面通道必须同时看覆盖率（与语料规模无关）
    title-coverage-threshold: 0.25
    literal-coverage-threshold: 0.50
    # 图遍历：命中页的 1 跳关联页按衰减分补位
    link-expand: true
    link-decay: 0.85

    distill:
      # 每日定时蒸馏（本地 7B 模型约 20–40 秒/页，异步执行）
      enabled: ${WIKI_DISTILL_ENABLED:true}
      cron: "${WIKI_DISTILL_CRON:0 30 3 * * ?}"
      # 单次最多蒸馏主题数 / 每主题送入 LLM 的原始块数
      limit: 10
      max-chunks: 6
      min-chunks: 2

    vector:
      # 与 RAG 的 exam_chunks 分开，互不影响
      collection: wiki_pages
      # 审核通过后自动推送页面摘要向量（失败不影响发布，ngram 仍可命中）
      auto-index: true

# ========== 健康检查 / 监控（Actuator）==========
# 仅暴露 health 与 info：health 匿名可访问（供负载均衡/容器编排探活），
# 其余端点一律不暴露，且 details 不对外（避免泄露数据库等内部状态）。
# 访问：GET /api/actuator/health
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  # Redis 是可选组件：未启动时不应把整体健康状态拖成 DOWN
  health:
    redis:
      enabled: false

logging:
  level:
    root: info
    com.examprep: debug
    org.springframework.security: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"


