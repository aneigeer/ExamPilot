version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: examprep-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: exam_prep
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
      - ./sql/migration-p0b.sql:/docker-entrypoint-initdb.d/03-migration-p0b.sql:ro
      - ./sql/migration-p1.sql:/docker-entrypoint-initdb.d/04-migration-p1.sql:ro
      - ./sql/migration-p1b.sql:/docker-entrypoint-initdb.d/05-migration-p1b.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    image: eclipse-temurin:21-jre
    container_name: examprep-backend
    working_dir: /app
    volumes:
      - ./backend/target/exam-prep-backend-1.0.0-SNAPSHOT.jar:/app/app.jar:ro
      - ./uploads:/data/uploads
    command: ["java", "-jar", "/app/app.jar", "--server.port=8080",
              "--spring.datasource.url=jdbc:mysql://mysql:3306/exam_prep?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai",
              "--app.upload-root=/data/uploads"]
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: examprep-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql-data:
