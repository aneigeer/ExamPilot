# ============================================================
# 生产/演示部署编排：MySQL + 后端 + Nginx
#
#   使用：docker compose -p examprep up -d --build
#
# ★ 安全提醒：本文件不再保存任何口令默认值。启动前必须设置 MYSQL_ROOT_PASSWORD。
#   正式部署务必通过环境变量注入强口令：
#     MYSQL_ROOT_PASSWORD=xxx docker compose -p examprep up -d
# ============================================================

name: examprep

services:
  mysql:
    image: mysql:8.0
    container_name: examprep-mysql
    environment:
      # 默认值仅为本地演示；生产用环境变量覆盖
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?请先设置环境变量 MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: exam_prep
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      # 初始化脚本按文件名字典序执行，编号前缀即执行顺序
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
      - ./sql/migration-p0b.sql:/docker-entrypoint-initdb.d/03-migration-p0b.sql:ro
      - ./sql/migration-p1.sql:/docker-entrypoint-initdb.d/04-migration-p1.sql:ro
      - ./sql/migration-p1b.sql:/docker-entrypoint-initdb.d/05-migration-p1b.sql:ro
      - ./sql/migration-register.sql:/docker-entrypoint-initdb.d/06-migration-register.sql:ro
      - ./sql/migration-info-computing-subjects.sql:/docker-entrypoint-initdb.d/07-migration-info-computing-subjects.sql:ro
      - ./sql/migration-ai.sql:/docker-entrypoint-initdb.d/08-migration-ai.sql:ro
      - ./sql/migration-ai-vector.sql:/docker-entrypoint-initdb.d/09-migration-ai-vector.sql:ro
      - ./sql/migration-perf.sql:/docker-entrypoint-initdb.d/10-migration-perf.sql:ro
      - ./sql/migration-srs.sql:/docker-entrypoint-initdb.d/11-migration-srs.sql:ro
      - ./sql/migration-courseware.sql:/docker-entrypoint-initdb.d/12-migration-courseware.sql:ro
      - ./sql/migration-agent.sql:/docker-entrypoint-initdb.d/13-migration-agent.sql:ro
      - ./sql/migration-agent-checkpoint.sql:/docker-entrypoint-initdb.d/14-migration-agent-checkpoint.sql:ro
      - ./sql/migration-agent-memory.sql:/docker-entrypoint-initdb.d/15-migration-agent-memory.sql:ro
      - ./sql/migration-agent-memory-ltm.sql:/docker-entrypoint-initdb.d/16-migration-agent-memory-ltm.sql:ro
      - ./sql/migration-wiki.sql:/docker-entrypoint-initdb.d/17-migration-wiki.sql:ro
      - ./sql/migration-rsi.sql:/docker-entrypoint-initdb.d/18-migration-rsi.sql:ro
      - ./sql/migration-study-plan.sql:/docker-entrypoint-initdb.d/19-migration-study-plan.sql:ro
      - ./sql/migration-question-source.sql:/docker-entrypoint-initdb.d/20-migration-question-source.sql:ro
      - ./sql/migration-question-year.sql:/docker-entrypoint-initdb.d/21-migration-question-year.sql:ro
      - ./sql/migration-question-exam-code.sql:/docker-entrypoint-initdb.d/22-migration-question-exam-code.sql:ro
      - ./sql/migration-postgrad-category.sql:/docker-entrypoint-initdb.d/23-migration-postgrad-category.sql:ro
      - ./sql/migration-exam-platform.sql:/docker-entrypoint-initdb.d/24-migration-exam-platform.sql:ro
      - ./sql/migration-data-hub.sql:/docker-entrypoint-initdb.d/25-migration-data-hub.sql:ro
      - ./sql/migration-assessment-platform.sql:/docker-entrypoint-initdb.d/26-migration-assessment-platform.sql:ro
      - ./sql/migration-agent-observability.sql:/docker-entrypoint-initdb.d/27-migration-agent-observability.sql:ro
      - ./sql/migration-wiki-governance.sql:/docker-entrypoint-initdb.d/28-migration-wiki-governance.sql:ro
      - ./sql/migration-jobs-idempotency.sql:/docker-entrypoint-initdb.d/29-migration-jobs-idempotency.sql:ro
      - ./sql/migration-ai-quota.sql:/docker-entrypoint-initdb.d/30-migration-ai-quota.sql:ro
      # 可选：AI 语料种子（sql/data-ai-seed.sql / sql/data-study-methods.sql）。不挂载则 AI 语料为空，
      # 需要时手工执行：docker compose exec -T mysql mysql -uroot -p exam_prep < sql/data-ai-seed.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      # 容器内取环境变量：$$ 为 compose 转义，实际传给容器的是 $MYSQL_ROOT_PASSWORD
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: examprep-redis-prod
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: examprep-qdrant-prod
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    container_name: examprep-ai-service
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      QDRANT_URL: "http://qdrant:6333"
      QDRANT_COLLECTION: "exam_chunks"
      REDIS_URL: "redis://redis:6379/0"
      JAVA_BASE_URL: "http://backend:8080/api"
      AI_INTERNAL_TOKEN: "${AI_INTERNAL_TOKEN:?请通过环境变量注入 AI_INTERNAL_TOKEN}"
      JOB_WORKER_ENABLED: "${JOB_WORKER_ENABLED:-true}"
      EVAL_WORKER_ENABLED: "${EVAL_WORKER_ENABLED:-true}"
      WIKI_WORKER_ENABLED: "${WIKI_WORKER_ENABLED:-false}"
      LLM_PROVIDER: "${LLM_PROVIDER:-ollama}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_BASE_URL: "${LLM_BASE_URL:-https://api.openai.com/v1}"
      LLM_MODEL: "${LLM_MODEL:-gpt-4o-mini}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-exam-prep-7b}"
      OTEL_ENABLED: "${OTEL_ENABLED:-false}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: examprep-backend
    working_dir: /app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # JWT 密钥必填：未配置时后端会拒绝启动（见 application.yml 的安全规范）
      # 本地生成示例：openssl rand -hex 32
      JWT_SECRET: "${JWT_SECRET:?请通过环境变量注入 JWT_SECRET}"
      DB_USERNAME: root
      DB_PASSWORD: "${MYSQL_ROOT_PASSWORD:?请先设置环境变量 MYSQL_ROOT_PASSWORD}"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      AI_SERVICE_URL: "http://ai-service:8000"
      AI_INTERNAL_TOKEN: "${AI_INTERNAL_TOKEN:?请通过环境变量注入 AI_INTERNAL_TOKEN}"
      AI_JOBS_ENABLED: "${AI_JOBS_ENABLED:-true}"
      # 双模 LLM 切换：
      #   本地模式：LLM_PROVIDER=ollama（默认，通过 host.docker.internal 访问宿主机 Ollama）
      #   API 模式：LLM_PROVIDER=openai|dashscope|zhipu|auto + LLM_API_KEY + LLM_BASE_URL + LLM_MODEL
      LLM_PROVIDER: "${LLM_PROVIDER:-ollama}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_BASE_URL: "${LLM_BASE_URL:-https://api.openai.com/v1}"
      LLM_MODEL: "${LLM_MODEL:-gpt-4o-mini}"
      LLM_TIMEOUT_MS: "${LLM_TIMEOUT_MS:-30000}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen2.5-3b-instruct-q8_0-baseline}"
      # ★ 限流分桶的可信代理白名单（阻断项 B 修复配套）：容器形态下后端看到的 TCP 对端是
      #   nginx「容器 IP」，默认值 127.0.0.1,::1 匹配不到 → XFF 被忽略 → 全站共用一个桶
      #   （正常用户互相挤成 429）。本值必须与文件末尾 networks.default.ipam.subnet 完全一致。
      #   注意：backend 不发布端口（见本服务末尾的安全约束），只在 compose 内部网络可达。
      APP_RATE_LIMIT_TRUSTED_PROXIES: "172.28.0.0/16"
    volumes:
      # ★ 上传目录必须映射到宿主机，否则容器重建后上传文件全丢。
      #   与代码里的 app.upload.dir 保持一致（此前误写成 app.upload-root，导致该映射形同虚设）。
      - ./backend/uploads:/data/uploads
    command: ["--spring.datasource.url=jdbc:mysql://mysql:3306/exam_prep?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai",
              "--app.upload.dir=/data/uploads"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    # ★★ 安全约束（阻断项 B）：**不要给 backend 添加任何端口发布（宿主机 8080 映射）**。
    #   一旦 8080 暴露到宿主机/局域网，来访客户端的真实源 IP 会落在上面
    #   APP_RATE_LIMIT_TRUSTED_PROXIES 的可信段内 → 它自带的 X-Forwarded-For 重新被采信，
    #   伪造换桶绕过限流即刻复活。唯一对外入口应始终只有 nginx（仅它发布 80/443）。
    #   本机调试请直接 `java -jar` 跑（不经 nginx 时 XFF 一律被忽略，行为正确）。

  nginx:
    image: nginx:alpine
    container_name: examprep-nginx
    ports:
      - "80:80"
    volumes:
      # 当前为明文 HTTP 入口；要上 TLS 请改用 nginx-https.conf.example（见文件内说明）
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  qdrant-data:

networks:
  # ★ 钉死网段（阻断项 B 修复配套）：Docker 默认 bridge 的网段由引擎自动分配，
  #   白名单无法静态写死；而写笼统私有段（如 172.16.0.0/12）会在 backend 误发布端口时
  #   把局域网 IP 也变成「可信代理」，修复直接作废。因此这里固定一个专用网段。
  #   ⚠️ 改本值必须同步改 backend 的 APP_RATE_LIMIT_TRUSTED_PROXIES；
  #      且旧网络不会自动改 subnet，需 `docker compose -p examprep down` 后重新 up 才会重建。
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16
