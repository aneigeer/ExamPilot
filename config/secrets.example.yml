# ============================================================
# 本地凭据模板（可提交，**只有占位符**，不含任何真实口令）
#
# 用法：复制成同目录下的 secrets.local.yml，把 <CHANGE_ME_...> 换成真实强口令。
#   cp config/secrets.example.yml config/secrets.local.yml
#
# secrets.local.yml 已被 .gitignore 排除（规则：config/*.local.*），
# 禁止提交、禁止贴进文档/工单/聊天记录。
#
# 格式：扁平点号键（一行一个 key: value），方便 shell / batch / PowerShell
#       用一行命令取值，不会因为 YAML 嵌套层级不同而误取到别的 password。
#
# 口令要求（第 10 周 P0-1）：≥20 位，同时含大写、小写、数字、符号；
# 不要复用系统口令，不要用 123456 / admin123 这类字典口令。
# ============================================================

mysql.host: 127.0.0.1
mysql.port: 3306
mysql.user: root
# MySQL root@'localhost' 的口令（root@'%' 已删除，MySQL 仅监听 127.0.0.1）
mysql.root.password: "<CHANGE_ME_24_chars_mixed>"

# 超管 admin（user.student_no='admin'）的口令；库里只存 BCrypt 哈希
admin.user: admin
admin.password: "<CHANGE_ME_another_24_chars>"
