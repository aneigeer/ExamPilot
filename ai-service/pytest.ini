[pytest]
# AI 微服务测试配置
#
# 设计取舍：测试目录名固定为 tests，且在 pythonpath 中加入服务根目录，
# 保证 `pytest`（而非 `python -m pytest`）从任意位置运行都能 import app 包。
#
# ★ 重要：这套测试**不需要** Docker、不需要模型文件、不需要大模型 Key。
#   embedding 与 Qdrant 用桩替代；OCR 与 LLM 走真实降级路径（本来就该是 503）。
#   所以主理人装完 requirements.txt 后可直接 `pytest -q` 全绿。

testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 让断言失败时打印完整表达式的值，便于 Java 侧同学定位
addopts =
    -v
    --tb=short
    --strict-markers
    -p no:cacheprovider

# 屏蔽警告噪声，保持输出干净
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
