# ExamPilot · Nginx 入口（80 → 后端 8080）
server {
    listen 80;
    server_name _;
    client_max_body_size 210m;   # 覆盖文档上传 200MB 限制

    # 基础安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # E1-05 / F1：代码运行接口双重拦截。后端 app.code-run.enabled=false 时 Controller 不注册，
    # 这里再拒绝一次，防止日后误把开关置 true 就直接把「本机裸跑用户代码」暴露到公网。
    # 精确匹配（=）优先于下面的前缀匹配，且不受后端 context-path /api 之外路径影响。
    location = /api/run {
        deny all;
    }

    # Agent SSE 流式接口专用通道：关闭代理缓冲与缓存，保持长连接与 TraceId 透传
    location /api/ai/agent/stream {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Trace-Id $http_x_trace_id;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 全部 API 与管理端页面反代后端（管理端静态页由后端同源托管）
    location / {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # ★ 覆盖而非追加：nginx 的 *add_forwarded_for* 变量会把客户端自带的值拼在最前，
        #   后端若采信第一段即可被伪造换桶、绕过登录限流（阻断项 B）。用 $remote_addr 直接覆盖。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Trace-Id $http_x_trace_id;
        proxy_read_timeout 60s;
    }
}
