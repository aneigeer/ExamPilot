# ============================================================
#  ExamPilot · HTTPS 入口（局域网自签 / 正式可换 CA）
#
#  用法（Windows 本地 nginx）：
#    1) 生成证书（证书 SAN 会写入当前局域网 IP）：
#         powershell -ExecutionPolicy Bypass -File .\scripts\生成自签证书.ps1
#       产物：nginx/certs/server.crt + server.key（该目录已被 .gitignore 排除）
#    2) 校验配置：
#         nginx -p . -c nginx-https.conf -t
#    3) 启动 / 重载：
#         nginx -p . -c nginx-https.conf
#         nginx -p . -c nginx-https.conf -s reload
#    4) 验证：
#         curl -k -I https://<局域网IP>/            → 200
#         curl -I  http://<局域网IP>/               → 301 跳 https
#
#  ★ 为什么用 -p .（prefix = 项目根）：本文件里的证书路径写成
#      nginx/certs/server.crt 这类**相对 prefix** 的路径，
#      换机器时只要从项目根启动，路径就自动对，不需要改配置。
#  ★ 正式上线：把 server.crt/server.key 换成 CA 签发证书
#      （或 Let's Encrypt 的 fullchain.pem/privkey.pem），
#      并打开下面的 HSTS；其余配置无需改动。
# ============================================================

# ---------- 80：只做跳转（及 ACME 校验）----------
server {
    listen 80;
    server_name _;

    # 正式用 Let's Encrypt 时，校验路径必须保持明文可达
    location /.well-known/acme-challenge/ {
        root html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- 443：TLS 入口 ----------
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # ---- 证书：自签用 server.crt/key；CA 签发改成 fullchain/privkey 即可 ----
    ssl_certificate     nginx/certs/server.crt;
    ssl_certificate_key nginx/certs/server.key;

    # ---- 协议与套件：只留 TLS1.2/1.3，禁用弱套件 ----
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # 上传配额：覆盖文档上传 200MB 限制
    client_max_body_size 210m;

    # ---- 安全响应头 ----
    # HSTS：自签环境先不要开（浏览器一旦记住就无法回退到 http，手机调试会很难受）
    # 正式 CA 证书上线后取消下面一行的注释即可：
    #add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP：管理端是「零构建 Vue 全局版」，运行时编译器需要 'unsafe-eval'；
    # 若将来给管理端加构建步骤（模板预编译），把 'unsafe-eval' 去掉即可。
    # 若管理端引用了 CDN 资源，还需在 script-src/style-src 里追加对应域名（如 https://cdn.jsdelivr.net）。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # ---- 后端（Spring Boot，context-path=/api）----
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # ★ 覆盖而非追加（阻断项 B）：nginx 的 *add_forwarded_for* 变量会把客户端自带的 XFF 拼在最前，
        #   后端一旦采信第一段即可伪造 IP 绕过登录限流。$remote_addr 直接覆盖为真实对端地址。
        proxy_set_header X-Forwarded-For   $remote_addr;
        # 让后端知道真实协议（若有绝对地址/重定向生成依赖此头）
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;   # AI 面试单次评分可能 20-60s
        proxy_send_timeout 120s;
    }
}
